  function applyIndicators(js){
    if (!js || typeof js !== "object" || !js.symbols || typeof js.symbols !== "object") return false;
    var keys = Object.keys(js.symbols);
    if (!keys.length) return false;

    var out = [], asOf = null, fundGot = 0, skipped = 0;
    keys.forEach(function(tk){
      var r = js.symbols[tk];
      if (!r || typeof r !== "object") { skipped++; return; }
      /* the universe is whatever the file says it is — seed only supplies labels */
      var s = SEED_BY_TICKER[tk] ? cloneStock(SEED_BY_TICKER[tk]) : newStock(tk, r);
      if (typeof r.name === "string" && r.name) s.name = r.name;
      if (typeof r.nameHe === "string" && r.nameHe) s.nameHe = r.nameHe;
      if (typeof r.sector === "string" && r.sector) s.sector = r.sector;
      if (typeof r.industry === "string" && r.industry) s.industry = r.industry;
      if (typeof r.exchange === "string" && r.exchange) s.exchange = r.exchange;

      IND_FIELDS.forEach(function(pair){
        var raw = r[pair[1]];
        if (raw === null || raw === undefined || raw === "") return;
        var v = Number(raw);
        if (isFinite(v)) s[pair[0]] = v;
      });
      if (r.bars !== undefined && isFinite(Number(r.bars))) s.bars = Number(r.bars);
      if (r.high52 !== undefined && isFinite(Number(r.high52))) s.high52 = Number(r.high52);

      /* fundamentals — a null/blank live value never overwrites the seed number,
         it only leaves that field marked as a reference value */
      var f = r.fundamentals, fundTouched = false;
      if (f && typeof f === "object") {
        FUND_FIELDS.forEach(function(k){
          var raw = f[k];
          if (raw === null || raw === undefined || raw === "") return;
          var v = Number(raw);
          if (!isFinite(v)) return;
          s[k] = v;
          s.fundLive[k] = true;
          fundTouched = true;
        });
        if (fundTouched) fundGot++;
      }
      if (!asOf && typeof r.asOf === "string") asOf = r.asOf;
      out.push(s);
    });
    if (!out.length) return false;

    STOCKS = out;
    DATA.loaded = true;
    DATA.count = out.length;
    DATA.asOf = asOf || null;
    DATA.source = (typeof js.source === "string") ? js.source : null;
    DATA.generatedAt = (typeof js.generatedAt === "string") ? js.generatedAt : null;
    DATA.failed = Array.isArray(js.failed) ? js.failed.slice(0) : [];
    DATA.fundCount = fundGot;
    if (typeof js.universe === "number" && isFinite(js.universe)) DATA.universe = js.universe;
    else DATA.universe = out.length;
    if (typeof js.fundamentalsSource === "string") DATA.fundSource = js.fundamentalsSource;
    pruneSearchState();
    syncAPI();
    return true;
  }

  /* absolute URL so a <base> tag or a nested path can never send us elsewhere */
  function indicatorsURL(){
    try { return new URL("indicators.json", document.baseURI).href; }
    catch(e){ return "indicators.json"; }
  }

  function loadIndicators(){
    if (typeof fetch !== "function") return Promise.resolve(false);
    var done = false;
    var timeout = new Promise(function(resolve){ setTimeout(function(){ resolve(false); }, 6000); });
    var req = fetch(indicatorsURL(), { cache:"no-store", credentials:"omit" })
      .then(function(res){
        if (!res.ok) return null;
        return res.text();
      })
      .then(function(txt){
        if (!txt) return false;
        var js = null;
        try { js = JSON.parse(txt); } catch(e){ return false; }
        return applyIndicators(js);
      })
      .catch(function(){ return false; })
      .then(function(ok){ done = true; return ok; });
    return Promise.race([req, timeout]).then(function(ok){
      return done ? ok : false;
    });
  }

  };

  /* help copy may be a function of the active scan config — resolve it at render
     time so a popover never quotes a threshold the profile no longer uses */
  function termField(t, f){
    var v = t ? t[f] : "";
    return (typeof v === "function") ? v(scanCfg()) : v;
  }

  /* ============================================================
     STATE + persistence (same keys as v1 — settings survive reload)
     ============================================================ */
  var PAGE_SIZE = 60;                  /* rows/cards rendered per page, never a dataset assumption */
  var STORE_KEY = "safetrend.config.v1";
  var PROFILE_KEY = "scanner.profile";  /* scan profile lives on its own key */
  var PROFILE_DEFAULT = "שמרני";
  var state = {
    portfolio:25000, riskPct:1.0, maxCapPct:15, stopMode:"conservative",
    layers:{1:true,2:true,3:true,4:true},
    profile:PROFILE_DEFAULT,
    showRejects:false, sector:null, sortKey:"rvol", sortDir:-1,
    preview:"auto", drawer:null, checks:{}, liveWindow:null,
    q:"", limit:PAGE_SIZE
  };

  function num(v, fallback){
    var n = parseFloat(v);
    return isFinite(n) ? n : fallback;
  }
  function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }

  function load(){
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch(e){ raw = null; }
    if (raw) {
      try {
        var o = JSON.parse(raw);
        if (o && typeof o === "object") {
          state.portfolio = clamp(num(o.portfolio, state.portfolio), 1000, 10000000);
          state.riskPct    = clamp(num(o.riskPct, state.riskPct), 0.25, 2.5);
          state.maxCapPct  = clamp(num(o.maxCapPct, state.maxCapPct), 1, 100);
          if (o.stopMode === "sma50" || o.stopMode === "fixed" || o.stopMode === "conservative") state.stopMode = o.stopMode;
          if (o.layers && typeof o.layers === "object") {
            ["1","2","3","4"].forEach(function(k){
              if (typeof o.layers[k] === "boolean") state.layers[k] = o.layers[k];
            });
          }
          if (typeof o.showRejects === "boolean") state.showRejects = o.showRejects;
        }
      } catch(e){ /* corrupted storage — keep defaults */ }
    }
    // tolerate flat legacy keys (portfolio / riskPct / maxCapPct)
    try {
      var p = localStorage.getItem("portfolio");
      if (p !== null && num(p, 0) > 0) state.portfolio = clamp(num(p, state.portfolio), 1000, 10000000);
      var r = localStorage.getItem("riskPct");
      if (r !== null && num(r, 0) > 0) state.riskPct = clamp(num(r, state.riskPct), 0.25, 2.5);
      var c = localStorage.getItem("maxCapPct");
      if (c !== null && num(c, 0) > 0) state.maxCapPct = clamp(num(c, state.maxCapPct), 1, 100);
    } catch(e){}
    /* the scan profile has its own key; an unknown/legacy value falls back to the default */
    try {
      var pr = localStorage.getItem(PROFILE_KEY);
      if (pr && PROFILES[pr]) state.profile = pr;
    } catch(e){}
  }
  function save(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        portfolio:state.portfolio, riskPct:state.riskPct, maxCapPct:state.maxCapPct,
        stopMode:state.stopMode, layers:state.layers, showRejects:state.showRejects
      }));
      localStorage.setItem(PROFILE_KEY, state.profile);
    } catch(e){ /* storage full / blocked — UI still works */ }
  }

  /* ============================================================
     FORMATTERS
     ============================================================ */
  function fmtMoney(v, d){
    if (!isFinite(v)) return "—";
    d = (d === undefined) ? 2 : d;
    return "$" + v.toLocaleString("en-US", { minimumFractionDigits:d, maximumFractionDigits:d });
  }
  function fmtCompact(v){
    if (!isFinite(v)) return "—";
    var a = Math.abs(v);
    if (a >= 1e12) return "$" + (v/1e12).toFixed(2) + "T";
    if (a >= 1e9)  return "$" + (v/1e9).toFixed(1) + "B";
    if (a >= 1e6)  return "$" + (v/1e6).toFixed(1) + "M";
    if (a >= 1e3)  return "$" + (v/1e3).toFixed(0) + "K";
    return "$" + v.toFixed(0);
  }
  function fmtVol(v){
    if (!isFinite(v)) return "—";
    if (v >= 1e6) return (v/1e6).toFixed(1) + "M";
    if (v >= 1e3) return Math.round(v/1e3) + "K";
    return String(Math.round(v));
  }
  function fmtPct(v, d){
    if (!isFinite(v)) return "—";
    d = (d === undefined) ? 1 : d;
    /* half-up, so a provider value like 50.65 reads 50.7% and not 50.6% */
    var p = Math.pow(10, d);
    var r = Math.round((v + (v >= 0 ? 1e-9 : -1e-9)) * p) / p;
    return (r > 0 ? "+" : "") + r.toFixed(d) + "%";
  }
  /* toFixed that survives a missing provider value */
  function nv(v, d){ return isFinite(v) ? v.toFixed(d) : "—"; }
  function fmtInt(v){
    if (!isFinite(v)) return "—";
    return Math.round(v).toLocaleString("en-US");
  }
  function esc(s){
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function unesc(s){ var d = document.createElement("textarea"); d.innerHTML = s; return d.value; }
  /* every number rendered through N() stays LTR inside the Hebrew paragraph */
  function N(s){ return '<bdi class="num">' + s + '</bdi>'; }

  /* 'עזר' marks any value that did not arrive live from the provider */
  function srcTag(s, k){
    if (s && s.fundLive && s.fundLive[k]) return "";
    return '<span class="srcchip ref">עזר</span>';
  }

  /* ============================================================
     EXPLAINER PATTERN — one button, one popover, one TERMS object
     ============================================================ */
  function q(key){
    var t = TERMS[key];
    if (!t) return "";
    return '<button class="q" type="button" data-term="' + key + '" aria-label="הסבר: ' + esc(t.t) + '" aria-haspopup="dialog" aria-expanded="false">?</button>';
  }

  var popEl = null, popBtn = null;
  function closeTerm(restoreFocus){
    if (!popEl || popEl.hidden) return;
    popEl.hidden = true;
    if (popBtn) popBtn.setAttribute("aria-expanded", "false");
    if (restoreFocus && popBtn && document.contains(popBtn)) popBtn.focus();
    popBtn = null;
  }
  function openTerm(key, btn){
    var t = TERMS[key];
    if (!t || !popEl) return;
    if (popBtn && popBtn !== btn) popBtn.setAttribute("aria-expanded", "false");
    popBtn = btn;
    document.getElementById("popTitle").textContent = t.t;
    document.getElementById("popShort").textContent = termField(t, "s");
    document.getElementById("popEx").textContent = termField(t, "e");
    popEl.hidden = false;
    btn.setAttribute("aria-expanded", "true");

    var r = btn.getBoundingClientRect();
    var pw = popEl.offsetWidth, ph = popEl.offsetHeight;
    var vw = document.documentElement.clientWidth;
    var vh = window.innerHeight;
    var left = r.left + r.width / 2 - pw / 2;
    left = Math.max(8, Math.min(left, vw - pw - 8));
    var top = r.bottom + 8;
    if (top + ph > vh - 8) top = Math.max(8, r.top - ph - 8);
    popEl.style.left = left + "px";
    popEl.style.top = top + "px";
  }

  function renderGlossary(){
    var keys = Object.keys(TERMS);
    var half = Math.ceil(keys.length / 2);
    var item = function(k){
      var t = TERMS[k];
      return '<div class="gloss"><h3>' + esc(t.t) + '</h3>' +
        '<div class="s">' + esc(termField(t, "s")) + '</div>' +
        '<div class="e"><b>דוגמה</b>' + esc(termField(t, "e")) + '</div></div>';
    };
    document.getElementById("glossGrid").innerHTML =
      '<div>' + keys.slice(0, half).map(item).join("") + '</div>' +
      '<div>' + keys.slice(half).map(item).join("") + '</div>';
  }

  /* ============================================================
     RISK ENGINE — exact spec math (unchanged)
     ============================================================ */
  function sizing(s){
    var p = s.price;
    var fixedStop = p * 0.94;
    var stop;
    if (state.stopMode === "sma50") stop = s.sma50;
    else if (state.stopMode === "fixed") stop = fixedStop;
    else stop = Math.max(s.sma50, fixedStop);   // tighter of the two = closer to price

    var riskPerShare = p - stop;
    var out = { stop:stop, riskPerShare:riskPerShare, shares:0, cost:0, cashRisk:0,
                target:0, rawShares:0, maxCapShares:0, capped:false, invalid:false,
                overStop:(isFinite(stop) && isFinite(p) && stop >= p),
                smaStop:s.sma50, fixedStop:fixedStop,
                winner:(s.sma50 > fixedStop ? "sma50" : "fixed"),
                smaDistPct:((p - s.sma50) / p) * 100,
                fixedDistPct:6, wide:((p - stop) / p) * 100 > 12 };

    /* A stop at or above the entry is not a trade — no shares, no risk, no target.
       This is not an edge case any more: on a pullback the SMA-50 anchor sits
       above the last close, and printing negative share counts there is a lie. */
    if (!(p > 0) || !(riskPerShare > 0)) {
      out.invalid = true;
      out.shares = 0;
      out.cost = 0;
      out.cashRisk = 0;
      out.rawShares = 0;
      out.maxCapShares = 0;
      out.target = p;
      return out;
    }
    var riskDollars = state.portfolio * state.riskPct / 100;
    var capDollars  = state.portfolio * state.maxCapPct / 100;

    out.rawShares    = Math.floor(riskDollars / riskPerShare);
    out.maxCapShares = Math.floor(capDollars / p);
    out.shares       = Math.min(out.rawShares, out.maxCapShares);
    out.capped       = out.maxCapShares < out.rawShares;
    out.cost         = out.shares * p;
    out.cashRisk     = out.shares * riskPerShare;
    out.target       = p + 2 * riskPerShare;
    return out;
  }

  /* Institutional ownership is the one L2 input the free Finnhub tier never
     sends: indicators.json carries instOwn:null for every symbol, and only the
     11 original names still in the universe keep a static dataset value. A
     missing value must never be read as "under 50%" — that would fail all 297
     names by construction. So the check is SKIPPED when the value is absent:
     not passed, not failed, and never counted against the name. */
  function instOwnKnown(s){
    if (!s) return false;
    var v = s.instOwn;
    if (v === null || v === undefined || v === "") return false;
    return isFinite(Number(v));
  }

  /* how many names in the current universe have no institutional value */
  function instOwnMissing(){
    var n = 0;
    STOCKS.forEach(function(s){ if (!instOwnKnown(s)) n++; });
    return n;
  }

  /* ============================================================
     SCAN PROFILE — one config object, three presets
     Every threshold the scanner applies lives in SCAN_DEFAULTS.
     A preset is a sparse overlay on top of it, so the strict
     defaults stay readable in one place and a relaxed profile can
     only move the values it names. layerFails(), failDetails(),
     the layer cards, the closest box, REC_CHECKS and every count
     read scanCfg() — no threshold literal is repeated anywhere.
     ============================================================ */
  var SCAN_DEFAULTS = {
    l1:{ mcap:2e9, price:20, betaMin:0.5, betaMax:1.5, avgVol:1e6 },
    l2:{ peMin:0, epsGrowth:10, salesGrowth:10, roe:15, instOwn:50 },
    l3:{ pctFrom52wHigh:-10, requirePerf:true },
    l4:{ rsiMin:50, rsiMax:65, dayMin:1, dayMax:5, rvol:1.2, closeStrength:65 }
  };

  /* relax = the values that move away from SCAN_DEFAULTS. Only the three
     presets below exist; 'רגוע' restates 'רגיל' relaxations explicitly so
     each preset can be read on its own. L1 is never relaxed. */
  var PROFILES = {
    "שמרני": {
      label:"שמרני",
      hint:"ברירת המחדל — כל הספים המקוריים, הסריקה הקפדנית ביותר.",
      relax:null
    },
    "רגיל": {
      label:"רגיל",
      hint:"מרפה רק את שכבת נגד-רדיפה — טווח יומי, RSI ונפח יחסי.",
      relax:{ l4:{ dayMin:0, rvol:1.0, rsiMin:45, rsiMax:70 } }
    },
    "רגוע": {
      label:"רגוע",
      hint:"מרפה גם את איכות העסק והמגמה, ומרחיב עוד את שכבת נגד-רדיפה.",
      relax:{
        l2:{ epsGrowth:5, salesGrowth:5, roe:10 },
        l3:{ pctFrom52wHigh:-20, requirePerf:false },
        l4:{ dayMin:0, rvol:0.8, rsiMin:45, rsiMax:70, closeStrength:55 }
      }
    }
  };

  function trimNum(v){
    if (!isFinite(Number(v))) return "—";
    return String(Math.round(Number(v) * 100) / 100);
  }
  function oneDec(v){
    if (!isFinite(Number(v))) return "—";
    return Number(v).toFixed(1);
  }
  function mcapText(v){
    if (!isFinite(v)) return "—";
    if (v >= 1e9) return "$" + trimNum(v / 1e9) + " מיליארד";
    if (v >= 1e6) return "$" + trimNum(v / 1e6) + " מיליון";
    return fmtCompact(v);
  }
  function volText(v){
    if (!isFinite(v)) return "—";
    var m = v / 1e6;
    return (m === 1 ? "מיליון" : trimNum(m) + " מיליון");
  }

  function buildConfig(name){
    var relax = (PROFILES[name] || PROFILES[PROFILE_DEFAULT]).relax || {};
    var c = { l1:{}, l2:{}, l3:{}, l4:{} };
    ["l1","l2","l3","l4"].forEach(function(l){
      Object.keys(SCAN_DEFAULTS[l]).forEach(function(k){
        var ov = relax[l] ? relax[l][k] : undefined;
        c[l][k] = (ov === undefined) ? SCAN_DEFAULTS[l][k] : ov;
      });
    });
    return c;
  }

  var CFG_CACHE = null, CFG_CACHE_FOR = null;
  function scanCfg(){
    if (!CFG_CACHE || CFG_CACHE_FOR !== state.profile){
      CFG_CACHE = buildConfig(state.profile);
      CFG_CACHE_FOR = state.profile;
    }
    return CFG_CACHE;
  }

  /* every configurable field with its reader-facing label — the label IS the
     "מותאם" chip text, so the card can never claim a value it does not use */
  var CFG_FIELDS = [
    { layer:1, keys:[["l1","mcap"]],                      label:function(C){ return "שווי שוק " + mcapText(C.l1.mcap); } },
    { layer:1, keys:[["l1","price"]],                     label:function(C){ return "מחיר $" + trimNum(C.l1.price); } },
    { layer:1, keys:[["l1","betaMin"],["l1","betaMax"]],  label:function(C){ return "בטא " + trimNum(C.l1.betaMin) + "–" + trimNum(C.l1.betaMax); } },
    { layer:1, keys:[["l1","avgVol"]],                    label:function(C){ return "נפח " + volText(C.l1.avgVol); } },
    { layer:2, keys:[["l2","peMin"]],                     label:function(C){ return "מכפיל רווח מעל " + trimNum(C.l2.peMin); } },
    { layer:2, keys:[["l2","epsGrowth"]],                 label:function(C){ return "צמיחת רווח " + trimNum(C.l2.epsGrowth) + "%"; } },
    { layer:2, keys:[["l2","salesGrowth"]],               label:function(C){ return "צמיחת מכירות " + trimNum(C.l2.salesGrowth) + "%"; } },
    { layer:2, keys:[["l2","roe"]],                       label:function(C){ return "תשואה על ההון " + trimNum(C.l2.roe) + "%"; } },
    { layer:2, keys:[["l2","instOwn"]],                   label:function(C){ return "מוסדיים " + trimNum(C.l2.instOwn) + "%"; } },
    { layer:3, keys:[["l3","pctFrom52wHigh"]],            label:function(C){ return "מרחק מהשיא " + trimNum(C.l3.pctFrom52wHigh) + "%"; } },
    { layer:3, keys:[["l3","requirePerf"]],               label:function(C){ return C.l3.requirePerf ? "תשואה 3/6 נדרשת" : "תשואה 3/6 לא נדרשת"; } },
    { layer:4, keys:[["l4","rsiMin"],["l4","rsiMax"]],    label:function(C){ return "RSI " + trimNum(C.l4.rsiMin) + "–" + trimNum(C.l4.rsiMax); } },
    { layer:4, keys:[["l4","dayMin"],["l4","dayMax"]],    label:function(C){ return "יום " + trimNum(C.l4.dayMin) + "–" + trimNum(C.l4.dayMax) + "%"; } },
    { layer:4, keys:[["l4","rvol"]],                      label:function(C){ return "נפח יחסי " + oneDec(C.l4.rvol) + "x"; } },
    { layer:4, keys:[["l4","closeStrength"]],             label:function(C){ return "חוזק סגירה " + trimNum(C.l4.closeStrength) + "%"; } }
  ];

  /* per-layer list of thresholds that differ from the strict default */
  function cfgDiffs(){
    var C = scanCfg(), out = { 1:[], 2:[], 3:[], 4:[] };
    CFG_FIELDS.forEach(function(f){
      var moved = f.keys.some(function(k){
        return C[k[0]][k[1]] !== SCAN_DEFAULTS[k[0]][k[1]];
      });
      if (moved) out[f.layer].push(f.label(C));
    });
    return out;
  }
  function cfgDiffCount(){
    var d = cfgDiffs();
    return d[1].length + d[2].length + d[3].length + d[4].length;
  }

  /* the bullet list on each layer card — built from the same config */
  function layerRules(n, C){
    if (n === 1) return [
      "שווי שוק מעל " + mcapText(C.l1.mcap),
      "מחיר מעל $" + trimNum(C.l1.price),
      "בטא בין " + trimNum(C.l1.betaMin) + " ל-" + trimNum(C.l1.betaMax),
      "נפח מסחר יומי מעל " + volText(C.l1.avgVol)
    ];
    if (n === 2) return [
      C.l2.peMin > 0 ? "מכפיל רווח מעל " + trimNum(C.l2.peMin) : "מכפיל רווח חיובי",
      "צמיחת רווח למניה מעל " + trimNum(C.l2.epsGrowth) + "%",
      "צמיחת מכירות מעל " + trimNum(C.l2.salesGrowth) + "%",
      "תשואה על ההון מעל " + trimNum(C.l2.roe) + "%",
      "מוסדיים מחזיקים מעל " + trimNum(C.l2.instOwn) + "%"
    ];
    if (n === 3) {
      var r = [
        "מחיר מעל ממוצע 20 מעל 50 מעל 200",
        "עד " + Math.abs(C.l3.pctFrom52wHigh) + "% מתחת לשיא 52 שבועות"
      ];
      if (C.l3.requirePerf) r.push("תשואה חיובית ב-3 וב-6 חודשים");
      return r;
    }
    if (n === 4) return [
      "RSI בין " + trimNum(C.l4.rsiMin) + " ל-" + trimNum(C.l4.rsiMax),
      "עליית יום בין " + trimNum(C.l4.dayMin) + "% ל-" + trimNum(C.l4.dayMax) + "%",
      "נפח יחסי מעל " + oneDec(C.l4.rvol),
      "חוזק סגירה מעל " + trimNum(C.l4.closeStrength) + "%"
    ];
    return [];
  }

  function layerFails(s){
    var C = scanCfg(), f = [];
    if (!(s.mcap > C.l1.mcap)) f.push(1);
    if (!(s.price > C.l1.price)) f.push(1);
    if (!(s.beta >= C.l1.betaMin && s.beta <= C.l1.betaMax)) f.push(1);
    if (!(s.avgVol > C.l1.avgVol)) f.push(1);

    if (!(s.pe > C.l2.peMin)) f.push(2);
    if (!(s.epsGrowth > C.l2.epsGrowth)) f.push(2);
    if (!(s.salesGrowth > C.l2.salesGrowth)) f.push(2);
    if (!(s.roe > C.l2.roe)) f.push(2);
    if (instOwnKnown(s) && !(s.instOwn > C.l2.instOwn)) f.push(2);   /* no data → skipped */

    if (!(s.price > s.sma20 && s.sma20 > s.sma50 && s.sma50 > s.sma200)) f.push(3);
    if (!(s.pctFrom52wHigh >= C.l3.pctFrom52wHigh)) f.push(3);
    if (C.l3.requirePerf && !(s.perf3m > 0 && s.perf6m > 0)) f.push(3);

    if (!(s.rsi >= C.l4.rsiMin && s.rsi <= C.l4.rsiMax)) f.push(4);
    if (!(s.dayChange > C.l4.dayMin && s.dayChange < C.l4.dayMax)) f.push(4);
    if (!(s.rvol > C.l4.rvol)) f.push(4);
    if (!(s.closeStrength > C.l4.closeStrength)) f.push(4);

    return f.filter(function(v, i, a){ return a.indexOf(v) === i; });
  }

  /* one layerFails() pass per name per render — the layer toggles cannot change
     inside a render, and evaluate() is called from the table, the sector
     grouping and the closest box on the same 297 names. */
  var EV_CACHE = {};

  function evaluator(s){
    var hit = EV_CACHE[s.ticker];
    if (hit) return hit;
    var fails = layerFails(s);
    var active = fails.filter(function(n){ return state.layers[String(n)]; });
    EV_CACHE[s.ticker] = { fails:fails, active:active, pass:active.length === 0 };
    return EV_CACHE[s.ticker];
  }

  function passing(){
    return STOCKS.filter(function(s){ return evaluator(s).pass; });
  }

  /* the name that came closest to passing — used when the table is empty */
  function nearMiss(){
    var best = null, bestN = 99;
    STOCKS.forEach(function(s){
      var e = evaluator(s);
      var n = e.active.length || e.fails.length;
      if (n < bestN) { bestN = n; best = s; }
    });
    return best ? { s:best, n:bestN, fails:layerFails(best) } : null;
  }

  /* ============================================================
     UNIVERSE — search, sector grouping, paging
     Every helper here runs over the whole file (N names). The DOM
     only ever holds one page of rows, the numbers never do.
     ============================================================ */
  var SECTOR_TOP = 8;              /* radar: top 8 sectors, the rest grouped as 'אחר' */
  var sectorTop = [], sectorOther = {};

  function norm(v){ return String(v === null || v === undefined ? "" : v).toLowerCase(); }

  function matchesQuery(s, q){
    if (!q) return true;
    var hay = norm(s.ticker) + " " + norm(s.name) + " " + norm(s.nameHe) + " " +
              norm(s.sector) + " " + norm(s.industry);
    return q.split(/\s+/).filter(Boolean).every(function(w){ return hay.indexOf(w) !== -1; });
  }

  function computeSectors(){
    var counts = {};
    passing().forEach(function(s){ counts[s.sector] = (counts[s.sector] || 0) + 1; });
    var keys = Object.keys(counts).sort(function(a, b){
      return counts[b] - counts[a] || String(a).localeCompare(String(b));
    });
    sectorTop = keys.slice(0, SECTOR_TOP);
    var rest = keys.slice(SECTOR_TOP);
    sectorOther = {};
    if (rest.length) STOCKS.forEach(function(s){ if (rest.indexOf(s.sector) !== -1) sectorOther[s.ticker] = true; });
    return { counts:counts, keys:keys, top:sectorTop, rest:rest };
  }

  function inSectorGroup(s){
    if (!state.sector) return true;
    if (state.sector === "__other__") return !!sectorOther[s.ticker];
    return s.sector === state.sector;
  }

  /* the search filter, applied to the full universe */
  function searchActive(){ return !!norm(state.q).trim(); }

  /* every symbol the query matches — sector filter and layer toggles do NOT
     narrow this: a search for a ticker must always come back with that ticker */
  function searchPool(){
    var q = norm(state.q).trim();
    return STOCKS.filter(function(s){ return matchesQuery(s, q); });
  }

  function searchRows(){
    var q = norm(state.q).trim();
    return STOCKS.filter(function(s){ return matchesQuery(s, q) && inSectorGroup(s); });
  }

  /* after a data reload: back to the first page, and drop a sector that vanished */
  function pruneSearchState(){
    state.limit = PAGE_SIZE;
    if (state.sector && state.sector !== "__other__" &&
        !STOCKS.some(function(s){ return s.sector === state.sector; })) state.sector = null;
  }

  function syncAPI(){
    if (window.SafeTrend) {
      window.SafeTrend.stocks = STOCKS.map(function(s){ return s.ticker; });
      window.SafeTrend.universe = STOCKS.length;
    }
  }


  /* ============================================================
     CLOSEST TO PASSING — the empty-table fallback
     On a red day nothing clears L4 (day change must be +1%..+5%),
     so the table is empty and a beginner has nothing to look at.
     Instead of an empty box we rank the names by how little they
     miss, and name the exact check with its real value.

     failDetails() mirrors layerFails() comparison for comparison:
     same thresholds, same order. If one changes, change both —
     window.SafeTrend.closest() is asserted against SafeTrend.all()
     .fails in verify_closest.py so a drift fails the build.
     ============================================================ */
  function failDetails(s){
    var out = [];
    var C = scanCfg();
    function add(layer, html){ out.push({ layer:layer, text:html }); }

    /* L1 — safety */
    if (!(s.mcap > C.l1.mcap))             add(1, "שווי שוק " + N(fmtCompact(s.mcap)) + " (נדרש מעל " + N(mcapText(C.l1.mcap)) + ")");
    if (!(s.price > C.l1.price))           add(1, "מחיר " + N(fmtMoney(s.price)) + " (נדרש מעל $" + N(trimNum(C.l1.price)) + ")");
    if (!(s.beta >= C.l1.betaMin && s.beta <= C.l1.betaMax)) add(1, "בטא " + N(nv(s.beta, 2)) + " (נדרש " + N(trimNum(C.l1.betaMin) + "–" + trimNum(C.l1.betaMax)) + ")");
    if (!(s.avgVol > C.l1.avgVol))         add(1, "נפח יומי " + N(fmtVol(s.avgVol)) + " (נדרש מעל " + N(volText(C.l1.avgVol)) + ")");

    /* L2 — business quality */
    if (!(s.pe > C.l2.peMin))              add(2, "מכפיל רווח " + N(s.pe > 0 ? nv(s.pe, 1) : "שלילי") + " (נדרש " + N(C.l2.peMin > 0 ? "מעל " + trimNum(C.l2.peMin) : "חיובי") + ")");
    if (!(s.epsGrowth > C.l2.epsGrowth))   add(2, "צמיחת רווח למניה " + N(fmtPct(s.epsGrowth, 1)) + " (נדרש מעל " + N(trimNum(C.l2.epsGrowth) + "%") + ")");
    if (!(s.salesGrowth > C.l2.salesGrowth)) add(2, "צמיחת מכירות " + N(fmtPct(s.salesGrowth, 1)) + " (נדרש מעל " + N(trimNum(C.l2.salesGrowth) + "%") + ")");
    if (!(s.roe > C.l2.roe))               add(2, "תשואה על ההון " + N(nv(s.roe, 1) + "%") + " (נדרש מעל " + N(trimNum(C.l2.roe) + "%") + ")");
    if (instOwnKnown(s) && !(s.instOwn > C.l2.instOwn)) add(2, "מוחזקות מוסדיות " + N(nv(s.instOwn, 0) + "%") + " (נדרש מעל " + N(trimNum(C.l2.instOwn) + "%") + ")" + '<span class="srcchip ref">עזר</span>');

    /* L3 — trend: report the link of the chain that actually broke */
    if (!(s.price > s.sma20 && s.sma20 > s.sma50 && s.sma50 > s.sma200)) {
      var t;
      if (!(s.price > s.sma20)) {
        t = (s.price < s.sma50)
          ? "מחיר " + N(fmtMoney(s.price)) + " מתחת ל-SMA50 " + N(fmtMoney(s.sma50))
          : "מחיר " + N(fmtMoney(s.price)) + " מתחת ל-SMA20 " + N(fmtMoney(s.sma20));
      } else if (!(s.sma20 > s.sma50)) {
        t = "SMA20 " + N(fmtMoney(s.sma20)) + " מתחת ל-SMA50 " + N(fmtMoney(s.sma50));
      } else {
        t = "SMA50 " + N(fmtMoney(s.sma50)) + " מתחת ל-SMA200 " + N(fmtMoney(s.sma200));
      }
      add(3, t);
    }
    if (!(s.pctFrom52wHigh >= C.l3.pctFrom52wHigh)) add(3, "מרחק משיא 52 שבועות " + N(fmtPct(s.pctFrom52wHigh, 1)) + " (נדרש עד " + N(trimNum(Math.abs(C.l3.pctFrom52wHigh)) + "%- מתחת") + ")");
    if (C.l3.requirePerf && !(s.perf3m > 0 && s.perf6m > 0)) add(3, "תשואה " + N(fmtPct(s.perf3m, 1)) + " ב-3 חודשים ו-" + N(fmtPct(s.perf6m, 1)) + " ב-6 (נדרשות חיוביות)");

    /* L4 — anti-chase */
    if (!(s.rsi >= C.l4.rsiMin && s.rsi <= C.l4.rsiMax)) add(4, "RSI " + N(nv(s.rsi, 1)) + " (נדרש " + N(trimNum(C.l4.rsiMin) + "–" + trimNum(C.l4.rsiMax)) + ")");
    if (!(s.dayChange > C.l4.dayMin && s.dayChange < C.l4.dayMax)) add(4, "שינוי יומי " + N(fmtPct(s.dayChange, 2)) + " (נדרש +" + N(trimNum(C.l4.dayMin)) + "% עד +" + N(trimNum(C.l4.dayMax)) + "%)");
    if (!(s.rvol > C.l4.rvol))             add(4, "נפח יחסי " + N(nv(s.rvol, 2) + "x") + " (נדרש מעל " + N(oneDec(C.l4.rvol) + "x") + ")");
    if (!(s.closeStrength > C.l4.closeStrength)) add(4, "חוזק סגירה " + N(nv(s.closeStrength, 0) + "%") + " (נדרש מעל " + N(trimNum(C.l4.closeStrength) + "%") + ")");

    return out;
  }

  /* ranked: fewest failed layers first, then fewest failed checks */
  function closestRows(n, pool){
    var rows = [];
    (pool || STOCKS).forEach(function(s){
      var st = statusOf(s);                          /* cached: det is reused */
      if (!st.fails.length) return;                  /* passed — it is in the table */
      var active = st.det.filter(function(d){ return !!state.layers[String(d.layer)]; });
      if (!active.length) return;                    /* passed under the toggles */
      var layers = [];
      active.forEach(function(d){ if (layers.indexOf(d.layer) === -1) layers.push(d.layer); });
      rows.push({ s:s, detail:st.det, active:active, layers:layers });
    });
    rows.sort(function(a, b){
      if (a.layers.length !== b.layers.length) return a.layers.length - b.layers.length;
      if (a.active.length !== b.active.length) return a.active.length - b.active.length;
      return a.s.ticker.localeCompare(b.s.ticker);
    });
    return rows.slice(0, n || 5);
  }

  function closestChipHTML(d){
    var on = !!state.layers[String(d.layer)];
    return '<span class="cc-chip">' +
      '<span class="cc-why"><b class="ltag">L' + d.layer + '</b> · ' +
      '<span class="cc-txt">' + d.text + '</span></span>' +
      (on ? '<button type="button" class="cc-off" data-off-layer="' + d.layer + '" ' +
        'title="כיבוי שכבת L' + d.layer + ' והצגת מה היא מפסידה">כבה L' + d.layer + '</button>' : '') +
    '</span>';
  }

  function closestRowHTML(r, i){
    var s = r.s;
    return '<li class="cc-row" data-closest="' + esc(s.ticker) + '" tabindex="0" ' +
        'aria-label="פתיחת הפרטים של ' + esc(s.ticker) + '">' +
      '<span class="cc-rank">' + (i + 1) + '</span>' +
      '<div class="cc-main">' +
        '<div class="cc-top">' +
          '<span class="tk">' + esc(s.ticker) + '</span>' +
          '<span class="cc-name">' + esc(s.nameHe) + '</span>' +
          '<span class="cc-metrics">' +
            '<bdi class="cc-price">' + fmtMoney(s.price) + '</bdi>' +
            '<bdi class="chg' + (s.dayChange < 0 ? " neg" : "") + '">' + fmtPct(s.dayChange, 2) + '</bdi>' +
            '<span class="rsi-chip' + (s.rsi > 65 ? " warm" : "") + '">RSI ' + N(nv(s.rsi, 1)) + '</span>' +
            '<span class="cc-layers">' + (r.layers.length === 1 ? "שכבה אחת" : r.layers.length + " שכבות") +
              ' · ' + r.active.length + ' בדיקות</span>' +
          '</span>' +
        '</div>' +
        '<div class="cc-chips">' + r.active.map(closestChipHTML).join("") +
          (state.layers["2"] && !instOwnKnown(s)
            ? '<span class="cc-skip"><b class="ltag">L2</b> · אחזקת מוסדיים: <b>לא זמין</b> — הבדיקה דולגה' +
              '<span class="srcchip ref">עזר</span></span>'
            : '') +
        '</div>' +
      '</div>' +
    '</li>';
  }

  function renderClosest(){
    var slot = document.getElementById("emptyState");
    if (!slot) return;
    /* during a search every match is a row that carries its own verdict chip,
       so the fallback list would only repeat the same names */
    if (searchActive()) { slot.innerHTML = ""; return; }
    /* the fallback list is drawn from the same narrowed pool as the table */
    var pool = searchRows();
    var passingInPool = pool.filter(function(s){ return evaluator(s).pass; });
    if (!pool.length || passingInPool.length) { slot.innerHTML = ""; return; }
    var list = closestRows(5, pool);
    if (!list.length) { slot.innerHTML = ""; return; }

    slot.innerHTML = '<div class="closest" id="closestBox">' +
      '<div class="closest-head">' +
        '<h3>הכי קרובות לעמוד בכל השכבות</h3>' +
        '<span class="note">' + list.length + ' מתוך ' + pool.length +
          (state.q.trim() ? ' בתוצאות החיפוש' : '') + ' · לפי מספר השכבות שנכשלו, ואז מספר הבדיקות</span>' +
      '</div>' +
      '<p class="closest-intro">ביום ירידות כמעט ולא נמצאות מניות שמטפסות — זה מה שהמסנן נועד לעשות. אלה הקרובות ביותר, והשכבה שמנעה אותן מסומנת.</p>' +
      '<ol class="cc-list">' + list.map(closestRowHTML).join("") + '</ol>' +
      '<div class="cc-foot">לחיצה על שורה פותחת גרף ותוכנית סיכון. כפתור ״כבה״ בתוך הסיבה מכבה את השכבה הזאת ומראה מיד מה היא מפסידה — אפשר להדליק אותה בחזרה למעלה.</div>' +
    '</div>';

    document.querySelectorAll("#closestBox [data-off-layer]").forEach(function(btn){
      btn.addEventListener("click", function(ev){
        ev.stopPropagation();
        var n = btn.getAttribute("data-off-layer");
        state.layers[n] = false;
        save();
        renderAll();
        renderExample();
        showToast("שכבה L" + n + " כבויה — הטבלה מציגה עכשיו מה היא מפסידה");
      });
    });
    document.querySelectorAll("#closestBox [data-closest]").forEach(function(row){
      var open = function(){ openDrawer(row.getAttribute("data-closest")); };
      row.addEventListener("click", function(ev){
        if (ev.target.closest("[data-off-layer]")) return;
        open();
      });
      row.addEventListener("keydown", function(ev){
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); }
      });
    });
  }

  /* ============================================================
     DAILY PICKS — the 'המלצות היום' card at the top of the page
     It is derived, never curated: the names that clear every active
     layer, sized with the user's own portfolio / risk / cap, ranked
     by position size (RVOL breaks the tie). A stop at or above the
     entry is not a trade, so that name is dropped — same rule the
     table uses. Nothing passes → the card says so and names the
     closest miss instead of inventing a pick.
     ============================================================ */
  var REC_MAX = 3;

  function recPicks(){
    var rows = passing().map(function(s){ return { s:s, z:sizing(s) }; });
    var ok = rows.filter(function(r){ return !r.z.invalid && r.z.shares > 0; });
    var blocked = rows.filter(function(r){ return r.z.invalid || !(r.z.shares > 0); });
    ok.sort(function(a, b){
      if (b.z.shares !== a.z.shares) return b.z.shares - a.z.shares;
      return b.s.rvol - a.s.rvol;
    });
    return { picks: ok.slice(0, REC_MAX), found: rows.length, blocked: blocked, total: STOCKS.length };
  }

  function recWhy(s, nLayers){
    var bits = [];
    bits.push((s.price > s.sma20 && s.sma20 > s.sma50 && s.sma50 > s.sma200)
      ? "מגמה מעל 20/50/200" : "מבנה מעורב");
    bits.push("RSI " + N(nv(s.rsi, 0)));
    bits.push("שינוי יומי " + N(fmtPct(s.dayChange, 1)));
    bits.push("RVOL " + N(nv(s.rvol, 1) + "x"));
    return "עוברת את " + (nLayers === 4 ? "4 השכבות" : nLayers + " השכבות הפעילות") + ": " + bits.join(", ");
  }

  /* Which active check turned away the most names today. Only used for
     the plain-Hebrew "why nothing passed" line — never for pass/fail,
     which stays with layerFails(). Thresholds and labels come from the
     active profile config, so a relaxed scan explains itself in its own
     numbers. */
  var REC_CHECKS = [
    { on:function(s){ var C=scanCfg(); return !!state.layers["1"] && !(s.mcap > C.l1.mcap); },
      id:"mcap",  label:function(C){ return "שווי השוק מתחת ל-" + mcapText(C.l1.mcap); } },
    { on:function(s){ var C=scanCfg(); return !!state.layers["1"] && !(s.avgVol > C.l1.avgVol); },
      id:"vol",   label:function(C){ return "נפח המסחר היומי מתחת ל-" + volText(C.l1.avgVol); } },
    { on:function(s){ var C=scanCfg(); return !!state.layers["2"] && !(s.epsGrowth > C.l2.epsGrowth); },
      id:"fund",  label:function(){ return "הצמיחה העסקית לא עוברת את רף L2"; } },
    { on:function(s){ return !!state.layers["3"] && !(s.price > s.sma20); },
      id:"trend", label:function(){ return "המחיר מתחת לממוצע 20 יום"; } },
    { on:function(s){ return !!state.layers["3"] && !(s.sma20 > s.sma50 && s.sma50 > s.sma200); },
      id:"stack", label:function(){ return "הממוצעים לא מסודרים 20>50>200"; } },
    { on:function(s){ var C=scanCfg(); return C.l3.requirePerf && !!state.layers["3"] && !(s.perf3m > 0 && s.perf6m > 0); },
      id:"perf",  label:function(){ return "התשואה ב-3 או ב-6 חודשים שלילית"; } },
    { on:function(s){ var C=scanCfg(); return !!state.layers["4"] && !(s.rsi >= C.l4.rsiMin && s.rsi <= C.l4.rsiMax) && s.rsi < C.l4.rsiMin; },
      id:"rsiLow",  label:function(C){ return "RSI מתחת ל-" + trimNum(C.l4.rsiMin) + " (אין כוח קנייה)"; } },
    { on:function(s){ var C=scanCfg(); return !!state.layers["4"] && !(s.rsi >= C.l4.rsiMin && s.rsi <= C.l4.rsiMax) && s.rsi > C.l4.rsiMax; },
      id:"rsiHigh", label:function(C){ return "RSI מעל " + trimNum(C.l4.rsiMax) + " (המניה כבר רצה)"; } },
    { on:function(s){ var C=scanCfg(); return !!state.layers["4"] && !(s.dayChange > C.l4.dayMin && s.dayChange < C.l4.dayMax) && s.dayChange <= C.l4.dayMin; },
      id:"dayLow",  label:function(C){ return "השינוי היומי מתחת ל-+" + trimNum(C.l4.dayMin) + "%"; } },
    { on:function(s){ var C=scanCfg(); return !!state.layers["4"] && !(s.dayChange > C.l4.dayMin && s.dayChange < C.l4.dayMax) && s.dayChange >= C.l4.dayMax; },
      id:"dayHigh", label:function(C){ return "השינוי היומי מעל +" + trimNum(C.l4.dayMax) + "% (זינוק חד)"; } },
    { on:function(s){ var C=scanCfg(); return !!state.layers["4"] && !(s.rvol > C.l4.rvol); },
      id:"rvol",  label:function(C){ return "נפח יחסי מתחת ל-" + oneDec(C.l4.rvol) + "x"; } },
    { on:function(s){ var C=scanCfg(); return !!state.layers["4"] && !(s.closeStrength > C.l4.closeStrength); },
      id:"close", label:function(C){ return "חוזק סגירה מתחת ל-" + trimNum(C.l4.closeStrength) + "%"; } }
  ];

  var REC_CAUSE = {
    trend: "רוב השמות נסחרים מתחת לממוצע הקצר, ולכן מסנן המגמה לא מוצא מועמדות — זה בדיוק מה שהוא נועד לעשות ביום ירידות.",
    stack: "הממוצעים עוד לא התהפכו לסדר עולה, וזה מה שמסמן מגמה אמיתית ולא תיקון זמני.",
    dayLow:  "ביום שבו רוב המדגם לא עולה, אין מה לרדוף אחרי — וזה תקין.",
    dayHigh: "השמות שזינקו כבר עברו את הטווח שהשכבה מרשה, וכניסה אחרי זינוק היא רדיפה.",
    rsiLow:  "כשהמחירים יורדים, ה-RSI של רוב המדגם נשבר מתחת ל-50 — סימן שאין קונים, ולכן אין כניסה.",
    rsiHigh: "השמות שכן במגמה כבר רצו חזק מדי, והשכבה הזאת קיימת כדי לא לקנות בקצה העלייה.",
    rvol:  "אין נפח חריג מאחורי התנועה — בלעדיו אין מי שיחזיק את המחיר.",
    close: "המניות נסגרו חלש בתוך טווח היום, ולכן אין להן את הדחיפה שנדרשת לכניסה.",
    perf:  "התשואה ב-3 או ב-6 חודשים שלילית — זאת לא מגמה עולה, גם אם היום היה ירוק.",
    fund:  "הנתונים העסקיים (רווח, מכירות, תשואה על ההון) לא עומדים ברף של L2.",
    mcap:  "אין במדגם שם קטן מדי — הבעיה כאן היא לא גודל החברה.",
    vol:   "נפח המסחר היומי דק מדי, ולכן אי אפשר להיכנס ולצאת בלי להזיז את המחיר."
  };

  function recCause(){
    var best = null, bestN = 0;
    REC_CHECKS.forEach(function(c){
      var n = 0;
      STOCKS.forEach(function(s){ if (c.on(s)) n++; });
      if (n > bestN) { bestN = n; best = c; }
    });
    if (!best) return "";
    var head = "הבדיקה שפסלה הכי הרבה שמות היום: " + best.label(scanCfg()) +
      " (" + bestN + " מתוך " + STOCKS.length + "). ";
    return head + (REC_CAUSE[best.id] || "המסנן עובד כמו שהוא אמור — עדיף בלי עסקה מאשר עם אחת חלשה.");
  }

  function recRowHTML(r, rank, nLayers){
    var s = r.s, z = r.z;
    var capPct = state.portfolio ? (z.cost / state.portfolio) * 100 : 0;
    var riskPctOfPort = state.portfolio ? (z.cashRisk / state.portfolio) * 100 : 0;
    var stopUnder = s.price ? Math.abs((z.stop - s.price) / s.price) * 100 : 0;
    return '<li class="rec-row" data-rec="' + esc(s.ticker) + '" tabindex="0" role="button" ' +
        'data-shares="' + z.shares + '" data-stop="' + nv(z.stop, 2) + '" data-target="' + nv(z.target, 2) + '" ' +
        'data-cost="' + nv(z.cost, 2) + '" data-risk="' + nv(z.cashRisk, 2) + '" ' +
        'data-riskpct="' + riskPctOfPort.toFixed(2) + '" data-cappct="' + capPct.toFixed(1) + '" ' +
        'aria-label="פתיחת תוכנית הסיכון של ' + esc(s.ticker) + '">' +
      '<div class="rec-top">' +
        '<span class="rec-rank">' + rank + '</span>' +
        '<span class="tk">' + esc(s.ticker) + '</span>' +
        '<span class="rec-name">' + esc(s.nameHe) + '</span>' +
        (z.capped ? '<span class="capped">בתקרה</span>' : '') +
        '<span class="rec-price">' + N(fmtMoney(s.price)) + ' · ' + N(fmtPct(s.dayChange, 2)) + '</span>' +
      '</div>' +
      '<p class="rec-act">' + [
        '<span class="seg">כניסה ' + N(fmtMoney(s.price)) + '</span>',
        '<span class="seg"><span class="sep">·</span> סטופ ' + N(fmtMoney(z.stop)) + ' (' + N(stopUnder.toFixed(1) + "%") + ' מתחת)</span>',
        '<span class="seg"><span class="sep">·</span> ' + N(fmtInt(z.shares)) + ' מניות</span>',
        '<span class="seg"><span class="sep">·</span> סה״כ ' + N(fmtMoney(z.cost, 0)) + ' (' + N(capPct.toFixed(1) + "%") + ' מהתיק)</span>',
        '<span class="seg"><span class="sep">·</span> יעד 2R ' + N(fmtMoney(z.target)) + '</span>'
      ].join(" ") + '</p>' +
      '<p class="rec-loss">הפסד מקסימלי אם הסטופ נפגע: <b>' + N(fmtMoney(z.cashRisk, 0)) + '</b> · ' +
        N(riskPctOfPort.toFixed(2) + "%") + ' מהתיק</p>' +
      '<p class="rec-why"><b class="ltag">למה</b>' + recWhy(s, nLayers) + '</p>' +
    '</li>';
  }

  function renderRecs(){
    var card = document.getElementById("recsCard");
    var body = document.getElementById("recsBody");
    var chip = document.getElementById("recsChip");
    var foot = document.getElementById("recsFoot");
    var hint = document.getElementById("recsHint");
    if (!card || !body) return;

    /* never a number before the real data lands — a wrong pick that
       flashes for 300ms is worse than a loading line */
    if (!DATA.loaded) {
      card.className = "card recs loading";
      if (chip) { chip.hidden = true; chip.textContent = "0"; }
      if (hint) hint.textContent = "מחכה לנתוני השוק";
      body.innerHTML = DATA.settled
        ? '<p class="recs-empty">לא נטענו נתוני שוק — בלי מחירי סגירה אמיתיים אין בסיס להמלצה.' +
          '</p><p class="recs-sub">אפשר לטעון מחירים חיים מכפתור ״נתוני שוק״, ואז לחזור לכאן.</p>'
        : '<p class="recs-loading">טוען נתונים…</p>';
      if (foot) { foot.hidden = true; foot.innerHTML = ""; }
      return;
    }

    var R = recPicks();
    var nLayers = activeLayerCount();
    var count = R.picks.length;
    var html = "";

    if (count) {
      html += '<ol class="rec-list">' +
        R.picks.map(function(r, i){ return recRowHTML(r, i + 1, nLayers); }).join("") +
        '</ol>';
      if (R.blocked.length) {
        var many = R.blocked.length > 1;
        html += '<p class="rec-note">' +
          (many ? 'השמות הבאים נפסלו מההמלצות כי הסטופ שלהן מעל המחיר: '
                : 'השם הבא נפסל מההמלצות כי הסטופ שלו מעל המחיר: ') +
          R.blocked.map(function(r){
            return '<bdi>' + esc(r.s.ticker) + '</bdi> (' + N(fmtMoney(r.z.stop)) + ' מול ' + N(fmtMoney(r.s.price)) + ')';
          }).join(", ") +
          ' — אין עסקה בלי מרווח בין הכניסה לסטופ.</p>';
      }
    } else if (R.blocked.length) {
      html += '<p class="recs-empty">המועמדות שנמצאו נפסלו כי הסטופ שלהן מעל המחיר.</p>' +
        '<p class="recs-sub">הסטופ לפי העוגן שבחרת יושב מעל המחיר ב-' +
        R.blocked.map(function(r){ return '<bdi>' + esc(r.s.ticker) + '</bdi> (' + N(fmtMoney(r.z.stop)) + ' מול ' + N(fmtMoney(r.s.price)) + ')'; }).join(", ") +
        ' — במצב כזה אין מספר מניות שאפשר לחשב, ולכן אין המלצה.</p>' +
        '<p class="recs-sub">אפשר לעבור ל״מינוס 6%״ כעוגן סטופ, או לבדוק שוב מחר.</p>';
    } else {
      var nm = nearMiss();
      var layersTxt = (nLayers === 4 ? "ארבע השכבות" : N(String(nLayers)) + " השכבות הפעילות");
      html += '<p class="recs-empty">אין המלצות היום — ' + N("0 מתוך " + R.total) +
        ' עוברות את ' + layersTxt + '.';
      if (nm) {
        var act = layerFails(nm.s).filter(function(n){ return state.layers[String(n)]; });
        html += ' הקרוב ביותר: <bdi>' + esc(nm.s.ticker) + '</bdi> שנכשלה ב-' +
          '<bdi>' + (act.length ? "L" + act.join("/L") : "—") + '</bdi>.';
      }
      html += '</p>';
      var cause = recCause();
      if (cause) html += '<p class="recs-sub">' + esc(cause) + '</p>';
    }

    body.innerHTML = html;

    if (chip) {
      chip.hidden = false;
      chip.textContent = String(count);
    }
    card.className = "card recs " + (count ? "has" : "none");
    if (hint) hint.textContent = count
      ? "מדורג לפי גודל פוזיציה, שוויון נשבר ב-RVOL · מתעדכן עם כל שינוי בהגדרות"
      : "מוצג רק מה שעובר את כל השכבות הפעילות";

    if (foot) {
      foot.hidden = false;
      foot.innerHTML = 'מבוסס על נתוני סגירת ' + N(esc(DATA.asOf || "—")) +
        ' · חישוב לפי הכללים שלך (' + N(state.riskPct.toFixed(2) + "%") + ' סיכון, תקרה ' + N(String(state.maxCapPct) + "%") + ')' +
        ' · לא ייעוץ השקעות';
    }

    Array.prototype.forEach.call(body.querySelectorAll("[data-rec]"), function(row){
      var t = row.getAttribute("data-rec");
      row.addEventListener("click", function(){ openDrawer(t); });
      row.addEventListener("keydown", function(ev){
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openDrawer(t); }
      });
    });
  }

  /* ============================================================
     CLOCKS + TIMING (America/New_York via Intl — unchanged logic)
     ============================================================ */
  function tzParts(tz){
    var fmt = new Intl.DateTimeFormat("en-US", {
      timeZone:tz, hour12:false, weekday:"short",
      hour:"2-digit", minute:"2-digit", second:"2-digit",
      year:"numeric", month:"short", day:"2-digit"
    });
    var parts = fmt.formatToParts(new Date());
    var o = {};
    parts.forEach(function(p){ if (p.type !== "literal") o[p.type] = p.value; });
    if (o.hour === "24") o.hour = "00";
    return o;
  }
  var MONTH_HE = {Jan:"ינו׳",Feb:"פבר׳",Mar:"מרץ",Apr:"אפר׳",May:"מאי",Jun:"יוני",Jul:"יולי",Aug:"אוג׳",Sep:"ספט׳",Oct:"אוק׳",Nov:"נוב׳",Dec:"דצמ׳"};
  var DAY_HE = {Sun:"א׳",Mon:"ב׳",Tue:"ג׳",Wed:"ד׳",Thu:"ה׳",Fri:"ו׳",Sat:"ש׳"};

  function tickClocks(){
    try {
      var ny = tzParts("America/New_York");
      var il = tzParts("Asia/Jerusalem");
      var nyMinutes = parseInt(ny.hour,10)*60 + parseInt(ny.minute,10);

      setText("clockNY", ny.hour + ":" + ny.minute + ":" + ny.second);
      document.getElementById("dateNY").textContent = (DAY_HE[ny.weekday] || "") + " · " + ny.day + " ב" + (MONTH_HE[ny.month] || ny.month) + " " + ny.year;
      setText("clockIL", il.hour + ":" + il.minute + ":" + il.second);
      document.getElementById("dateIL").textContent = (DAY_HE[il.weekday] || "") + " · " + il.day + " ב" + (MONTH_HE[il.month] || il.month) + " " + il.year;

      var weekend = (ny.weekday === "Sat" || ny.weekday === "Sun");
      var dayKey = windowKeyFor(nyMinutes);
      state.liveWindow = dayKey;
      document.getElementById("sessionState").textContent = weekend ? "סגור (סוף שבוע)" : (nyMinutes >= 570 && nyMinutes < 960 ? "פתוח" : "סגור");
      renderTiming(weekend);
    } catch(e){
      // Intl timezone data unavailable — keep static labels, never throw
    }
  }
  function setText(id, val, small){
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = val;
    if (small) {
      var s = document.createElement("small");
      s.textContent = small;
      el.appendChild(s);
    }
  }
  function windowKeyFor(m){
    if (m >= 570 && m < 600) return "chaos";
    if (m >= 600 && m < 630) return "w1";
    if (m >= 630 && m < 885) return "chop";
    if (m >= 885 && m < 930) return "w2";
    return "w3";
  }
  function renderTiming(weekend){
    var key = (state.preview === "auto") ? (state.liveWindow || "w3") : state.preview;
    var w = WINDOWS[key];
    var badge = document.getElementById("timingBadge");
    badge.className = "badge tone-" + w.tone;
    document.getElementById("timingLabel").textContent = w.label;
    document.getElementById("timingAction").textContent = w.action;
    document.getElementById("timingRange").textContent = w.range;
    var pill = document.getElementById("previewPill");
    pill.hidden = (state.preview === "auto");
    var sched = [["chaos","כאוס","09:30"],["w1","חלון 1","10:00"],["chop","דשדוש","10:30"],["w2","חלון 2","14:45"],["w3","חלון 3","15:30"]];
    document.getElementById("timingSched").innerHTML = sched.map(function(it){
      return '<span class="sched' + (it[0] === key ? " on" : "") + '">' + it[1] + '<span class="tm">' + it[2] + '</span></span>';
    }).join("");
    var rh = document.getElementById("radarHint");
    if (rh) rh.textContent = (state.sector ? "מסונן לסקטור " + state.sector + " · לחיצה נוספת מבטלת" : "שמות שעברו, לפי סקטור · לחיצה מסננת את הטבלה");
    var meta = document.querySelector(".timing-meta");
    if (meta) meta.title = w.note;
    var cap = document.getElementById("timingCap");
    if (cap) cap.textContent = weekend ? "השוק סגור · חלון " + w.label : "חלון סריקה עכשיו";
  }

  /* ============================================================
     RISK BAR RENDER
     ============================================================ */
  function renderRisk(){
    var pIn = document.getElementById("portfolioInput");
    if (document.activeElement !== pIn) pIn.value = String(state.portfolio);
    var rIn = document.getElementById("riskSlider");
    rIn.value = String(state.riskPct);
    document.getElementById("riskValue").textContent = state.riskPct.toFixed(2) + "%";
    var cIn = document.getElementById("capInput");
    if (document.activeElement !== cIn) cIn.value = String(state.maxCapPct);
    document.querySelectorAll('input[name="stopMode"]').forEach(function(el){
      el.checked = (el.value === state.stopMode);
    });
    var modeLabel = state.stopMode === "sma50" ? "ממוצע 50" : (state.stopMode === "fixed" ? "מינוס 6%" : "הצמוד מביניהם");
    document.getElementById("stopModeHint").textContent = modeLabel;

    var riskDollars = state.portfolio * state.riskPct / 100;
    var capDollars = state.portfolio * state.maxCapPct / 100;

    /* what the risk engine actually ends up risking, after the cap is applied */
    var allZ = passing().map(function(s){ return sizing(s); });
    var zRows = allZ.filter(function(z){ return !z.invalid; });
    var blockedN = allZ.length - zRows.length;
    var cappedN = zRows.filter(function(z){ return z.capped; }).length;
    var effRisk = zRows.length ? zRows.reduce(function(a, z){
      return a + (z.cashRisk / state.portfolio) * 100; }, 0) / zRows.length : 0;
    var wallWide = zRows.filter(function(z){ return z.wide; }).length;
    var effTone = (zRows.length && effRisk < state.riskPct * 0.9) ? "am" : "em";
    var effNote = zRows.length
      ? cappedN + " מתוך " + zRows.length + " מוגבלות בתקרה של " + state.maxCapPct + "%"
      : "אין שורה זכאית לחישוב כרגע";
    if (blockedN) effNote += " · " + blockedN + " עם סטופ מעל המחיר";

    document.getElementById("riskSummary").innerHTML = [
      stat("סיכון לעסקה", N(fmtMoney(riskDollars, 0)), "em", "1R · " + state.riskPct.toFixed(2) + "% מהתיק", "riskPerTrade"),
      stat("סיכון אפקטיבי", N(effRisk.toFixed(2) + "%"), effTone,
           effNote, "effectiveRisk", "effRisk"),
      stat("פוזיציה מקסימלית", N(fmtMoney(capDollars, 0)), "am", state.maxCapPct + "% מהתיק למניה" + (wallWide ? " · " + wallWide + " עם סטופ רחב" : ""), "positionCap"),
      stat("עוגן הסטופ", modeLabel, "txt", state.stopMode === "fixed" ? "מחיר × 0.94" : (state.stopMode === "sma50" ? "ממוצע 50 יום" : "הגבוה מבין ממוצע 50 למינוס 6%"), "stopLoss"),
      stat("מניות שעוברות", N(passing().length + " / " + STOCKS.length), "", "לפי השכבות הפעילות", null)
    ].join("");

    var sbR = document.getElementById("sbRisk");
    if (sbR) sbR.textContent = fmtMoney(riskDollars, 0);
    var sbE = document.getElementById("sbEff");
    if (sbE) sbE.textContent = effRisk.toFixed(2) + "%";
    var sbC = document.getElementById("sbCap");
    if (sbC) sbC.textContent = fmtMoney(capDollars, 0);
    var sbP = document.getElementById("sbPass");
    if (sbP) sbP.textContent = passing().length + "/" + STOCKS.length;
  }
  function stat(k, v, tone, note, termKey, valId){
    return '<div class="stat"><div class="k">' + esc(k) + (termKey ? q(termKey) : "") + '</div>' +
      '<div class="v ' + (tone || "") + '"' + (valId ? ' id="' + valId + '"' : '') + '>' + v + '</div>' +
      '<div class="n">' + esc(note) + '</div></div>';
  }

  /* ============================================================
     RADAR RENDER
     ============================================================ */
  function renderRadar(){
    var rows = passing();
    var sec = computeSectors();          /* top 8 by count, everything else → 'אחר' */
    var groups = {};
    rows.forEach(function(s){
      var k = sec.top.indexOf(s.sector) !== -1 ? s.sector
            : (sec.rest.length ? "__other__" : s.sector);
      if (!groups[k]) groups[k] = { key:k, n:0, rvol:0, day:0, rest:0 };
      groups[k].n++;
      groups[k].rvol += s.rvol;
      groups[k].day  += s.dayChange;
      if (k === "__other__" && s.sector !== "__other__") groups[k].sectors = (groups[k].sectors || 0) + 1;
    });
    var totalRvol = rows.length ? rows.reduce(function(a,s){ return a + s.rvol; }, 0) / rows.length : 0;
    var totalDay  = rows.length ? rows.reduce(function(a,s){ return a + s.dayChange; }, 0) / rows.length : 0;

    var html = '';
    html += '<button class="radar-card all" data-sector="" aria-pressed="' + (state.sector ? "false" : "true") + '">' +
              '<div class="rc-top"><span class="rc-name">כל הסקטורים</span><span class="rc-count">' + N(String(rows.length)) + '</span></div>' +
              '<div class="rc-rvol">' + N(nv(totalRvol, 2)) + '<span>x</span></div>' +
              '<div class="rc-sub">נפח יחסי ממוצע</div>' +
              '<div class="rc-bar"><i style="width:' + Math.min(100, (totalRvol / 3) * 100).toFixed(1) + '%"></i></div>' +
              '<div class="rc-foot">' + N(fmtPct(totalDay)) + ' ממוצע יומי</div>' +
            '</button>';

    Object.keys(groups).sort(function(a,b){
      if (a === "__other__") return 1;
      if (b === "__other__") return -1;
      return groups[b].n - groups[a].n || a.localeCompare(b);
    }).forEach(function(k){
      var g = groups[k];
      var avg = g.rvol / g.n;
      var sel = (state.sector === k);
      var label = (k === "__other__") ? "אחר" : k;
      html += '<button class="radar-card" data-sector="' + esc(k) + '" aria-pressed="' + (sel ? "true" : "false") + '" aria-label="סינון הטבלה לסקטור ' + esc(label) + '">' +
                '<div class="rc-top"><span class="rc-name">' + esc(label) + '</span><span class="rc-count">' + N(String(g.n)) + '</span></div>' +
                '<div class="rc-rvol">' + N(nv(avg, 2)) + '<span>x</span></div>' +
                '<div class="rc-sub">נפח יחסי ממוצע</div>' +
                '<div class="rc-bar"><i style="width:' + Math.min(100, (avg / 3) * 100).toFixed(1) + '%"></i></div>' +
                '<div class="rc-foot">' + N(fmtPct(g.day / g.n)) + ' · ' + (g.n === 1 ? "שם אחד" : g.n + " שמות") +
                  (k === "__other__" ? ' · ' + (g.sectors || 0) + ' סקטורים' : '') + '</div>' +
              '</button>';
    });
    document.getElementById("radarGrid").innerHTML = html;

    document.querySelectorAll(".radar-card").forEach(function(card){
      card.addEventListener("click", function(){
        var s2 = card.getAttribute("data-sector") || "";
        state.sector = s2 ? (state.sector === s2 ? null : s2) : null;
        state.limit = PAGE_SIZE;
        renderAll();
      });
    });
  }

  /* ============================================================
     SCAN PROFILE RENDER — selector, banner, active label
     ============================================================ */
  var PROFILE_MS = 0;

  function profileNames(){ return Object.keys(PROFILES); }

  function buildProfileSeg(){
    var seg = document.getElementById("profileSeg");
    if (!seg) return;
    seg.innerHTML = profileNames().map(function(name){
      return '<button type="button" class="profile-btn" role="radio" aria-checked="false" data-profile="' + esc(name) + '">' +
        '<b>' + esc(name) + '</b><small>' + esc(PROFILES[name].hint) + '</small></button>';
    }).join("");
    Array.prototype.forEach.call(seg.querySelectorAll("[data-profile]"), function(btn){
      btn.addEventListener("click", function(){ setProfile(btn.getAttribute("data-profile")); });
      btn.addEventListener("keydown", function(ev){
        if (ev.key === "ArrowRight" || ev.key === "ArrowLeft" || ev.key === "ArrowDown" || ev.key === "ArrowUp"){
          ev.preventDefault();
          var names = profileNames();
          var i = names.indexOf(state.profile);
          var step = (ev.key === "ArrowRight" || ev.key === "ArrowDown") ? 1 : -1;
          setProfile(names[(i + step + names.length) % names.length]);
          var next = seg.querySelector('[data-profile="' + state.profile + '"]');
          if (next) next.focus();
        }
      });
    });
    renderProfile();
  }

  function setProfile(name){
    if (!PROFILES[name] || state.profile === name) return false;
    state.profile = name;
    save();
    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    renderAll();
    PROFILE_MS = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;
    return true;
  }

  function renderProfile(){
    var name = state.profile;
    var P = PROFILES[name] || PROFILES[PROFILE_DEFAULT];
    Array.prototype.forEach.call(document.querySelectorAll("[data-profile]"), function(b){
      var sel = b.getAttribute("data-profile") === name;
      b.setAttribute("aria-checked", sel ? "true" : "false");
      b.setAttribute("tabindex", sel ? "0" : "-1");
    });
    var active = document.getElementById("profileActive");
    if (active) active.textContent = P.label;
    var banner = document.getElementById("profileBanner");
    if (banner){
      var strict = (name === PROFILE_DEFAULT);
      banner.hidden = strict;
      banner.textContent = strict ? "" :
        "פרופיל " + P.label + " פעיל — הספים מרוככים מהברירת-מחדל" +
        (cfgDiffCount() ? " (" + cfgDiffCount() + " ספים מותאמים)" : "");
    }
  }

  function renderLayers(){
    var total = STOCKS.length;
    var C = scanCfg();
    var diffs = cfgDiffs();
    var html = LAYERS.map(function(L){
      var on = !!state.layers[String(L.n)];
      var passingLayer = STOCKS.filter(function(s){ return layerFails(s).indexOf(L.n) === -1; }).length;
      var chips = (diffs[L.n] || []).map(function(t){
        return '<span class="adj-chip" data-adj="' + L.n + '">מותאם: ' + esc(t) + '</span>';
      }).join("");
      return '<div class="layer-card' + (on ? "" : " off") + '" data-layer="' + L.n + '">' +
        '<div class="lc-head">' +
          '<span class="lc-num">L' + L.n + '</span>' +
          '<div><div class="lc-title">' + esc(L.title) + '</div><div class="lc-sub">' + esc(L.sub) + '</div></div>' +
          '<label class="switch" title="הפעלה או כיבוי של שכבה ' + L.n + '">' +
            '<input type="checkbox" data-layer-toggle="' + L.n + '"' + (on ? " checked" : "") + ' aria-label="הפעלת שכבת ' + esc(L.title) + '">' +
            '<span></span></label>' +
        '</div>' +
        (chips ? '<div class="adj-row" aria-label="ספים מותאמים בשכבה ' + L.n + '">' + chips + '</div>' : '') +
        '<ul class="lc-list">' + L.rules(C).map(function(r){
          /* institutional ownership is the one L2 rule that can be missing:
             it is labelled with its provenance and, when the provider sends
             nothing, says so instead of pretending the value is under 50% */
          if (!/מוסדיים/.test(r)) return '<li>' + esc(r) + '</li>';
          return '<li class="skipped">' + esc(r) + ' — <b>לא זמין</b> כשאין ערך, ולכן מדולג ' +
            '<span class="srcchip ref">עזר</span></li>';
        }).join("") + '</ul>' +
        '<div class="lc-count"><b>' + N(passingLayer + " / " + total) + '</b> עוברות את השכבה' + (on ? "" : " · כבויה") + '</div>' +
        (L.n === 2 && instOwnMissing()
          ? '<div class="lc-note" id="instSkipNote">בדיקת מוסדיים לא הייתה זמינה ל-' +
              N(String(instOwnMissing())) + ' מניות ולכן דולגה — היעדר נתון לא נחשב כישלון.</div>'
          : '') +
      '</div>';
    }).join("");
    document.getElementById("layersGrid").innerHTML = html;

    document.querySelectorAll("[data-layer-toggle]").forEach(function(cb){
      cb.addEventListener("change", function(){
        var n = cb.getAttribute("data-layer-toggle");
        state.layers[n] = cb.checked;
        save();
        renderAll();
      });
    });
  }

  /* ============================================================
     TABLE RENDER
     ============================================================ */
  function sortValue(s, key){
    var z = sizing(s);
    switch(key){
      case "ticker": return s.ticker;
      case "sector": return s.sector;
      case "price":  return s.price;
      case "day":    return s.dayChange;
      case "rvol":   return s.rvol;
      case "rsi":    return s.rsi;
      case "eps":    return s.epsGrowth;
      case "stop":   return z.stop;
      case "shares": return z.shares;
      case "cost":   return z.cost;
      case "risk":   return z.cashRisk;
      case "target": return z.target;
      default:       return s.rvol;
    }
  }
  /* --- search verdicts -------------------------------------------------
     layerFails() is the single source of truth. The chip reports the FULL
     4-layer verdict (not the toggled view): 'עוברת 4/4' or the first layer
     that failed. The reason is the same failDetails()[0] string the closest
     box prints, so the number in the row always matches the file.
     Cached per render pass — one row can be asked for its status twice
     (sort key + cell) and 297 names x 16 checks is not worth doing twice. */
  var ST_CACHE = {};

  function resetCaches(){ ST_CACHE = {}; EV_CACHE = {}; }

  function statusOf(s){
    if (ST_CACHE[s.ticker]) return ST_CACHE[s.ticker];
    var fails = layerFails(s);
    var det = fails.length ? failDetails(s) : [];
    ST_CACHE[s.ticker] = {
      fails:fails,
      det:det,                  /* kept so the closest box never rebuilds it */
      nf:fails.length,          /* 1st sort key — 0 means it passes */
      nd:det.length,            /* 2nd sort key — individual failed checks */
      pass:!fails.length,
      why:det.length ? det[0].text : ""
    };
    return ST_CACHE[s.ticker];
  }

  function statusChipHTML(st){
    if (st.pass) return '<span class="stchip pass" data-st="pass">עוברת 4/4</span>';
    return '<span class="stchip fail" data-st="fail" data-layer="' + st.fails[0] + '">' +
      'נפסלה ב-L' + st.fails[0] + '</span>';
  }

  function statusHTML(st){
    return '<div class="st-state">' + statusChipHTML(st) +
      (st.pass ? '' : '<span class="st-why">' + st.why + '</span>') + '</div>';
  }

  /* search mode: everything matched is rendered — passing rows first, then by
     failed layers, then by failed checks, then by the user's own sort key */
  function searchSortedRows(){
    var sv = state.sortKey, dir = state.sortDir;
    var scored = searchPool().map(function(s){
      return { s:s, st:statusOf(s), v:sortValue(s, sv) };
    });
    scored.sort(function(a, b){
      if (a.st.nf !== b.st.nf) return a.st.nf - b.st.nf;
      if (a.st.nd !== b.st.nd) return a.st.nd - b.st.nd;
      var va = a.v, vb = b.v;
      if (typeof va === "string" || typeof vb === "string") {
        var c = String(va).localeCompare(String(vb)) * dir;
        if (c) return c;
      } else if (isFinite(va) && isFinite(vb) && va !== vb) {
        return (va - vb) * dir;
      }
      return a.s.ticker.localeCompare(b.s.ticker);
    });
    return scored.map(function(r){ return r.s; });
  }

  function sortedRows(){
    computeSectors();                       /* sector top-8 affects the filter */
    if (searchActive()) return searchSortedRows();   /* toggles never hide a match */
    var pool = searchRows();                /* full universe: search + sector */
    var rows = pool.filter(function(s){ return evaluator(s).pass; });
    rows.sort(function(a,b){
      var va = sortValue(a, state.sortKey), vb = sortValue(b, state.sortKey);
      if (typeof va === "string" || typeof vb === "string") {
        return String(va).localeCompare(String(vb)) * state.sortDir;
      }
      if (!isFinite(va) && !isFinite(vb)) return 0;
      if (!isFinite(va)) return 1;          /* missing numbers always sink */
      if (!isFinite(vb)) return -1;
      return (va - vb) * state.sortDir;
    });
    return rows;
  }

  function trendGlyph(s){
    var ok = (s.price > s.sma20 && s.sma20 > s.sma50 && s.sma50 > s.sma200);
    return '<span class="trend">' + (ok ? '▲▲▲ ' + N("20&gt;50&gt;200") : '<span class="mixed">▲ מבנה מעורב</span>') + '</span>';
  }
  function rsiChip(s){
    var warm = s.rsi > 65;
    return '<span class="rsi-chip' + (warm ? " warm" : "") + '">RSI ' + N(nv(s.rsi, 0)) + '</span>';

      '</div></td>';
    return '<tr class="row' + (bad ? " norow" : "") + (st && !st.pass ? " rej" : "") +
        '" tabindex="0" data-ticker="' + esc(s.ticker) + '" aria-label="פתיחת הפרטים של ' + esc(s.ticker) + '">' +

        (s.live ? '<span class="livechip" title="המחיר והשינוי היומי נטענו עכשיו מהספק">חי</span>' : '') + '</div>' +
        '<span class="tk-name">' + esc(s.nameHe) + '</span>' +
        '<span class="sbadge">' + esc(s.sector) + '</span>' +
        (st ? statusHTML(st) : '') + '</div></td>' +
      '<td><div class="cell-2"><span class="price">' + N(fmtMoney(s.price)) + '</span>' +
        '<span class="chg' + (s.dayChange < 0 ? " neg" : "") + '">' + N(fmtPct(s.dayChange, 2)) + '</span></div></td>' +
      '<td><div class="cell-2"><span class="rvol hot">' + N(nv(s.rvol, 2) + "x") + '</span>' +
        '<span class="sub">סגירה ' + N(nv(s.closeStrength, 0) + "%") + '</span>' +
        '<div class="bar-mini' + (s.closeStrength < 70 ? " am" : "") + '"><i style="width:' + nv(clamp(closeW, 0, 100), 0) + '%"></i></div></div></td>' +
      '<td><div class="cell-2">' + trendGlyph(s) + rsiChip(s) + '</div></td>' +
      '<td><div class="cell-2"><span class="sub">רווח ' + N(fmtPct(s.epsGrowth)) + srcTag(s, "epsGrowth") + '</span>' +
        '<span class="sub">הון ' + N(nv(s.roe, 1) + "%") + srcTag(s, "roe") + '</span>' +
        '<span class="sub">מכפיל ' + N(nv(s.pe, 1)) + srcTag(s, "pe") + '</span>' +
        '<span class="fin-src">Finnhub</span></div></td>' +
      stopCell + sizeCell +

  }

        '<div class="mc-cell"><div class="k">סטופ</div><div class="v">' + N(fmtMoney(z.stop)) + ' <span class="pct">' + N(fmtPct(stopDist, 1)) + '</span></div></div>' +

        '<div class="mc-cell"><div class="k">RSI</div><div class="v">' + N(nv(s.rsi, 0)) + ' <span class="pct">' + (s.price > s.sma20 ? 'מעל ממוצע 20' : 'מתחת לממוצע 20') + '</span></div></div>' +

  function renderTable(){
    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    ST_CACHE = {};                          /* verdicts are per data state */
    EV_CACHE = {};                          /* layer verdicts are per toggle state */
    var rows = sortedRows(), total = rows.length;
    var shown = rows.slice(0, state.limit);

    document.getElementById("resultsChip").textContent = total + (total === 1 ? " שם" : " שמות");
    var pc = document.getElementById("passChip");
    if (pc) pc.textContent = passing().length + " / " + STOCKS.length;

    var thead = document.querySelectorAll("#stockTable thead th");
    thead.forEach(function(th){
      var k = th.getAttribute("data-sort");
      th.classList.toggle("sorted", k === state.sortKey);
      var old = th.querySelector(".arw");
      if (old) old.remove();
      if (k === state.sortKey) {
        var a = document.createElement("span");
        a.className = "arw";
        a.textContent = state.sortDir > 0 ? "▲" : "▼";
        th.appendChild(a);
      }
    });

    var body = document.getElementById("stockBody");
    var cards = document.getElementById("cardList");
    var searching = searchActive();
    var pool = searching ? searchPool() : searchRows();

    /* search mode changes what the table promises: every match, plus a chip */
    var tableEl = document.getElementById("stockTable");
    if (tableEl) tableEl.classList.toggle("searching", searching);
    var noteEl = document.getElementById("searchNote");
    if (noteEl) noteEl.hidden = !searching;

    if (!rows.length) {
      var msg;
      if (state.q.trim() && !pool.length) {
        msg = "לא נמצאה מניה בשם/טיקר הזה. היקום הוא " + STOCKS.length +
          " המניות הנזילות מעל $2B — אם תרצה מניה אחרת, אפשר להוסיף אותה לריצה היומית.";
      } else if (state.q.trim()) {
        msg = "אין מניה שעוברת את כל השכבות בתוצאות החיפוש. נקה את החיפוש או כבה שכבה.";
      } else if (state.sector) {
        msg = "אין מניה שעוברת את כל השכבות בסקטור הזה. כבו שכבה או בטלו את הסינון.";
      } else {
        var nm = nearMiss();
        msg = nm
          ? "0 מתוך " + STOCKS.length + " עוברות את כל השכבות עם הנתונים של " +
            (DATA.loaded && DATA.asOf ? "סגירת " + DATA.asOf : "הנתונים הנוכחיים") +
            ". הקרוב ביותר: " + nm.s.ticker + " — נכשלת ב-L" + nm.fails.join("/L") +
            ". כבו שכבה כדי לראות מה היא מפסידה."
          : "אין מניה שעוברת את כל השכבות. כבו שכבה או בטלו את הסינון.";
      }
      body.innerHTML = '<tr><td colspan="7"><div class="no-rows">' + esc(msg) + '</div></td></tr>';
      cards.innerHTML = '<div class="no-rows">' + esc(msg) + '</div>';
    } else {
      body.innerHTML = shown.map(rowHTML).join("");
      cards.innerHTML = shown.map(cardHTML).join("");
    }

    /* only the rendered page gets listeners — never the whole universe */
    body.querySelectorAll("tr[data-ticker]").forEach(function(el){
      el.addEventListener("click", function(){ openDrawer(el.getAttribute("data-ticker")); });
      el.addEventListener("keydown", function(ev){
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openDrawer(el.getAttribute("data-ticker")); }
      });
    });
    cards.querySelectorAll(".mcard").forEach(function(el){
      el.addEventListener("click", function(){ openDrawer(el.getAttribute("data-ticker")); });
    });

    /* filtered-out chips: capped, because the universe can be hundreds of names */
    var out = STOCKS.filter(function(s){ return !evaluator(s).pass; });
    var fo = document.getElementById("filteredOut");
    var CHIPS = 24;
    if (!out.length) {
      fo.innerHTML = "";
    } else {
      fo.innerHTML = '<span class="lbl">נפסלו</span>' + out.slice(0, CHIPS).map(function(s){
        var e = evaluator(s);
        return '<button class="fchip" data-chip="' + esc(s.ticker) + '" title="פתיחת הפרטים של ' + esc(s.ticker) + '">' +
          esc(s.ticker) + (s.live ? '<span class="fc-price">' + N(fmtMoney(s.price)) + '</span>' : '') +
          '<b>L' + e.active.join("/L") + '</b></button>';
      }).join("") + (out.length > CHIPS ? '<span class="lbl more">ועוד ' + (out.length - CHIPS) + '</span>' : "");
      fo.querySelectorAll("[data-chip]").forEach(function(b){
        b.addEventListener("click", function(){ openDrawer(b.getAttribute("data-chip")); });
      });
    }

    /* paging: one page in the DOM, the counter always covers the full set */
    var pager = document.getElementById("pager");
    if (pager) {
      if (!total) {
        pager.innerHTML = "";
      } else {
        pager.innerHTML = '<span class="p-note">מציג ' + N(String(shown.length)) + ' מתוך ' + N(String(total)) +
          (searching ? ' בתוצאות החיפוש' : ' עוברות') + '</span>' +
          (total > shown.length
            ? '<button type="button" class="btn-ghost p-more" id="moreBtn">הצג עוד ' + PAGE_SIZE + '</button>'
            : '<span class="p-done">הכול מוצג</span>');
        var more = document.getElementById("moreBtn");
        if (more) more.addEventListener("click", function(){
          state.limit += PAGE_SIZE;
          renderTable();
        });
      }
    }

    /* the search counter mirrors the live pool, not the page */
    var sc = document.getElementById("searchCount");
    if (sc) {
      sc.innerHTML = state.q.trim()
        ? 'מציג ' + N(String(pool.length)) + ' מתוך ' + N(String(STOCKS.length))
        : N(String(STOCKS.length)) + ' מניות ביקום';
    }

    /* the zero-results fallback — ranked near-misses with the exact failing check */
    renderClosest();
    RENDER_MS = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;
  }

     DRAWER — chart, ticket, checklist, links
