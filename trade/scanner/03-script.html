  function monthLabels(n){
    var out = [], now = new Date();
    for (var i = n - 1; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      out.push(d.toLocaleString("he-IL", { month:"short" }));
    }
    return out;
  }

  /* The file carries no OHLC history — only the last close plus the 3m/6m
     returns. So the price line is anchored on three real points (6 months
     ago, 3 months ago, the close) and interpolated between them. It is an
     approximation and the chart says so; the SMA lines are the real values. */
  function priceSeries(s){
    var p = s.price;
    var r6 = isFinite(s.perf6m) ? s.perf6m : null;
    var r3 = isFinite(s.perf3m) ? s.perf3m : null;
    if (!(p > 0) || r6 === null || r3 === null) return null;
    if (r6 <= -100 || r3 <= -100) return null;
    var v6 = p / (1 + r6 / 100), v3 = p / (1 + r3 / 100);
    if (!isFinite(v6) || !isFinite(v3) || v6 <= 0 || v3 <= 0) return null;
    var out = [], N = 7;
    for (var i = 0; i < N; i++) {
      var t = -6 + i;                                   /* months from now */
      out.push(t <= -3 ? v6 + (v3 - v6) * ((t + 6) / 3)
                       : v3 + (p - v3) * ((t + 3) / 3));
    }
    out[N - 1] = p;
    return out;
  }

  function chartSVG(s, z){
    var W = 640, H = 300, L = 12, R = 66, T = 16, B = 26;
    var pw = W - L - R, ph = H - T - B;
    var series = priceSeries(s) || (s.months || []).slice();
    var approximated = !!(DATA.loaded && priceSeries(s));
    var usable = series.length >= 2 && series.every(function(v){ return isFinite(v); });
    if (!usable) {
      return '<div class="chart-empty">אין היסטוריית מחירים לתצוגה עבור ' + esc(s.ticker) +
             ' — הקובץ סיפק מחיר אחרון בלבד, בלי סדרה שתורכב ממנה מגמה.</div>';
    }
    var refs = [
      { v:s.sma200, c:"#9c978a", label:"SMA200", dash:"5 4" },
      { v:s.sma50,  c:"#0f8a5f", label:"SMA50",  dash:"5 4" },
      { v:s.sma20,  c:"#b7791f", label:"SMA20",  dash:"5 4" },
      { v:z.stop,   c:"#c0392b", label:"Stop", dash:"6 3" }
    ];
    /* no target line when there is no valid stop — a 2R line at the entry price is noise */
    if (!z.invalid) refs.splice(3, 0, { v:z.target, c:"#1f4e79", label:"2R", dash:"6 3" });
    refs = refs.filter(function(r){ return isFinite(r.v); });
    var vals = series.concat(refs.map(function(r){ return r.v; }));
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = (max - min) || (max * 0.04) || 1;
    min -= span * 0.12; max += span * 0.12;
    if (z.target > max) max = z.target;
    if (z.stop < min) min = z.stop;

    function X(i){ return L + (series.length > 1 ? (i / (series.length - 1)) * pw : pw / 2); }
    function Y(v){ return T + ph - ((v - min) / (max - min)) * ph; }

    var g = "";
    for (var i = 0; i <= 4; i++) {
      var v = min + (max - min) * i / 4, y = Y(v);
      g += '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (L + pw) + '" y2="' + y.toFixed(1) + '" stroke="#ece8de" stroke-width="1"/>';
      g += '<text x="' + (L + pw + 8) + '" y="' + (y + 3.5).toFixed(1) + '" fill="#9c978a" font-size="10" font-family="Heebo,ui-monospace,monospace">' + v.toFixed(2) + '</text>';
    }

    var pts = series.map(function(v, i){ return [X(i), Y(v)]; });
    var path = pts.map(function(p, i){ return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var area = path + " L " + pts[pts.length-1][0].toFixed(1) + " " + (T + ph) + " L " + pts[0][0].toFixed(1) + " " + (T + ph) + " Z";

    var refMarkup = refs.map(function(r){
      var y = Y(r.v).toFixed(1);
      var isRef = (r.label === "Stop" || r.label === "2R");
      var labelW = r.label.length * 6.4 + 44;
      var mk = '<path d="M' + L + ' ' + y + ' L' + (L + pw) + ' ' + y + '" fill="none" stroke="' + r.c + '" stroke-width="' + (isRef ? 1.5 : 1.1) + '" stroke-dasharray="' + r.dash + '" opacity="' + (isRef ? .9 : .65) + '"/>';
      if (isRef) {
        mk += '<rect x="' + (L + pw - labelW - 2) + '" y="' + (Number(y) - 14) + '" width="' + labelW + '" height="13.5" rx="3" fill="#ffffff" opacity=".95" stroke="#e7e4dc" stroke-width=".7"/>' +
              '<text x="' + (L + pw - 6) + '" y="' + (Number(y) - 4) + '" text-anchor="end" fill="' + r.c + '" font-size="9.5" font-family="Heebo,ui-monospace,monospace">' + r.label + ' ' + r.v.toFixed(2) + '</text>';
      }
      return mk;
    }).join("");

    var dots = pts.map(function(p, i){
      if (i === pts.length - 1) {
        return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4" fill="#1f4e79"/>' +
               '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="1.6" fill="#ffffff"/>';
      }
      return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.3"/>';
    }).join("");

    var labels = monthLabels(series.length);
    var xlabels = labels.map(function(m, i){
      return '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" fill="#9c978a" font-size="9.5" font-family="Assistant,sans-serif" opacity="' + (i % 2 === 0 || i === labels.length - 1 ? 1 : 0) + '">' + m + '</text>';
    }).join("");

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="גרף מחיר לחצי שנה של ' + esc(s.ticker) + ' עם ממוצעים 20, 50 ו-200, קו סטופ ויעד 2R' + (approximated ? ', קו מחיר מקורב בין תשואות 3 ו-6 חודשים' : '') + '">' +
      g +
      '<path d="' + area + '" fill="rgba(31,78,121,.06)"/>' +
      refMarkup +
      '<path d="' + path + '" fill="none" stroke="#1f4e79" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + xlabels +
      '</svg>';
  }

      '</div>';

    var drawer = document.getElementById("drawer");

  function metric(k, v, tone, note, termKey){
    return '<div class="metric"><div class="k">' + esc(k) + (termKey ? q(termKey) : "") + '</div>' +
      '<div class="v ' + (tone || "") + '">' + v + '</div>' +
      (note ? '<div class="n">' + note + '</div>' : "") + '</div>';
  }

  /* the seven fundamentals, labelled by provenance: live Finnhub or עזר */
  function fundTableHTML(s){
    function tr(label, termKey, value, k, na){
      return '<tr' + (k === "instOwn" ? ' class="ref"' : '') + '>' +
        '<th scope="row">' + esc(label) + (termKey ? q(termKey) : "") + srcTag(s, k) + '</th>' +
        '<td' + (na ? ' class="na"' : '') + '>' + value + '</td></tr>';
    }
    /* no institutional value → 'לא זמין' + the fact that the check is skipped.
       It never renders as a number, a dash or a verdict on the name. */
    var instNa = !instOwnKnown(s);
    return '<table class="fund-t" id="fundTable" aria-label="פונדמנטלס: חיים מ-Finnhub, אחזקת מוסדיים בעזר">' +
      '<tbody>' +
        tr("מכפיל רווח (P/E)", "pe", s.pe > 0 ? N(nv(s.pe, 1)) : N("שלילי"), "pe") +
        tr("צמיחת רווח למניה", "epsGrowth", N(fmtPct(s.epsGrowth)), "epsGrowth") +
        tr("צמיחת מכירות", "salesGrowth", N(fmtPct(s.salesGrowth)), "salesGrowth") +
        tr("תשואה על ההון (ROE)", "roe", N(nv(s.roe, 1) + "%"), "roe") +
        tr("בטא", "beta", N(nv(s.beta, 2)), "beta") +
        tr("שווי שוק", "mcap", N(fmtCompact(s.mcap)), "mcap") +
        tr("אחזקת מוסדיים", "instOwn",
           instNa ? '<span class="fund-na">לא זמין</span><span class="fund-na-note">הבדיקה מדולגת</span>'
                  : N(nv(s.instOwn, 0) + "%"),
           "instOwn", instNa) +
      '</tbody></table>';
  }

  function closeDrawer(){
    state.drawer = null;
    var drawer = document.getElementById("drawer");
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
    var bd = document.getElementById("backdrop");
    bd.classList.remove("open");
    bd.hidden = true;
    document.body.style.overflow = "";
  }

  function copyText(text, okMsg){
    var done = function(ok){
      showToast(ok ? okMsg : "הדפדפן חסם העתקה — אפשר לסמן את הכרטיס ידנית");
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){
        done(fallbackCopy(text));
      });
    } else {
      done(fallbackCopy(text));
    }
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ok = document.execCommand("copy");
    } catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ============================================================
     LIVE DATA — user-supplied API key, browser-side only.
     The key lives in localStorage ("scanner.api") and is sent to
     nothing but the provider endpoint the user picked.
     ============================================================ */
  var API_STORE = "scanner.api";
  var PROVIDER_NAME = { fmp:"Financial Modeling Prep", finnhub:"Finnhub" };
  var API_MSG = {
    auth: "המפתח לא תקין או שפג תוקפו",
    rate: "חרגת ממכסת הבקשות של הספק — נסה שוב בעוד דקה",
    net:  "לא הצלחתי להגיע לספק. בדוק חיבור או נסה ספק אחר"
  };

  var apiState = { provider:"fmp", key:"", live:false, updatedAt:null, updated:[] };
  var demoSnap = {};              /* ticker -> price/dayChange before the first live write */
  var apiBusy = false;
  var sheetEl = null, bdEl = null, keyIn = null, provSel = null, statusEl = null;

  function apiReadStore(){
    try {
      var raw = localStorage.getItem(API_STORE);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || typeof o !== "object") return;
      if (o.provider === "fmp" || o.provider === "finnhub") apiState.provider = o.provider;
      if (typeof o.key === "string") apiState.key = o.key;
    } catch(e){ /* storage blocked or corrupt — stay in demo mode */ }
  }
  function apiWriteStore(provider, key){
    apiState.provider = provider;
    apiState.key = key;
    try {
      localStorage.setItem(API_STORE, JSON.stringify({ provider:provider, key:key }));
      return true;
    } catch(e){ return false; }
  }
  function apiDropKey(){
    apiState.key = "";
    try { localStorage.removeItem(API_STORE); } catch(e){}
  }

  function apiEndpoint(provider, ticker, key){
    if (provider === "finnhub") {
      return "https://finnhub.io/api/v1/quote?symbol=" + encodeURIComponent(ticker) +
             "&token=" + encodeURIComponent(key);
    }
    return "https://financialmodelingprep.com/stable/quote?symbol=" + encodeURIComponent(ticker) +
           "&apikey=" + encodeURIComponent(key);
  }

  /* one request, 9s ceiling; failures carry a `kind` so the caller can classify them */
  function apiFetchQuote(provider, ticker, key){
    var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 9000);
    var opts = { cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer" };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(apiEndpoint(provider, ticker, key), opts).then(function(res){
      if (res.status === 401 || res.status === 403) { var a = new Error("auth"); a.kind = "auth"; throw a; }
      if (res.status === 429) { var r = new Error("rate"); r.kind = "rate"; throw r; }
      if (!res.ok) { var h = new Error("http " + res.status); h.kind = "http"; throw h; }
      return res.json();
    }).then(function(data){
      clearTimeout(timer);
      return apiParseQuote(provider, data);
    }, function(err){
      clearTimeout(timer);
      if (!err || !err.kind) { var n = new Error("net"); n.kind = "net"; throw n; }
      throw err;
    });
  }

  function apiParseQuote(provider, data){
    if (provider === "finnhub") {
      var c = data ? Number(data.c) : NaN;
      var dp = data ? Number(data.dp) : NaN;
      if (!isFinite(c) || c <= 0 || !isFinite(dp)) return null;
      return { price:c, change:dp };
    }
    var row = (Object.prototype.toString.call(data) === "[object Array]") ? data[0] : data;
    if (!row) return null;
    var p = Number(row.price), ch = Number(row.changePercentage);
    if (!isFinite(p) || p <= 0 || !isFinite(ch)) return null;
    return { price:p, change:ch };
  }

  function apiSetStatus(msg, tone){
    if (!statusEl) return;
    statusEl.textContent = msg || "";
    statusEl.className = "api-status" + (tone ? " " + tone : "");
    /* the sheet is closed during a header refresh — mirror the loader's own
       progress text next to the button so the run is visible */
    if (refreshing) refreshNote(msg || "", tone === "err" ? "err" : "");
  }
  function apiSyncButtons(){
    ["apiSave","apiLoad","apiRemove"].forEach(function(id){
      var b = document.getElementById(id);
      if (b) b.disabled = apiBusy;
    });
    var l = document.getElementById("apiLoad");
    if (l) l.textContent = apiBusy ? "טוען…" : "טען מחירים חיים";
  }
  function apiEye(show){
    if (!keyIn) return;
    var b = document.getElementById("apiEye");
    keyIn.type = show ? "text" : "password";
    if (b) {
      b.textContent = show ? "הסתר" : "הצג";
      b.setAttribute("aria-pressed", show ? "true" : "false");
      b.setAttribute("aria-label", show ? "הסתרת המפתח" : "הצגת המפתח");
    }
  }
  function apiRefreshKeyState(){
    var lab = document.getElementById("apiKeyState");
    if (lab) lab.textContent = apiState.key ? "נשמר בדפדפן" : "לא נשמר";
    var dot = document.getElementById("apiDot");
    if (dot) dot.hidden = !apiState.key;
  }

  function apiOpenSheet(){
    if (!sheetEl) return;
    provSel.value = apiState.provider;
    keyIn.value = apiState.key;
    apiEye(false);
    bdEl.hidden = false;
    sheetEl.hidden = false;
    document.body.classList.add("sheet-open");
    document.getElementById("apiOpen").setAttribute("aria-expanded", "true");
    apiRefreshKeyState();
    if (!statusEl.textContent) {
      apiSetStatus(apiState.key ? "מפתח שמור בדפדפן הזה. אפשר לטעון מחירים חיים." : "", "");
    }
    try { keyIn.focus({ preventScroll:true }); } catch(e){ keyIn.focus(); }
  }
  function apiCloseSheet(){
    if (!sheetEl || sheetEl.hidden) return;
    sheetEl.hidden = true;
    bdEl.hidden = true;
    document.body.classList.remove("sheet-open");
    apiEye(false);
    document.getElementById("apiOpen").setAttribute("aria-expanded", "false");
    var ob = document.getElementById("apiOpen");
    if (ob) ob.focus();
  }

  function apiDoSave(){
    var k = (keyIn.value || "").trim();
    if (!k) { apiSetStatus("הזן מפתח API לפני השמירה.", "err"); keyIn.focus(); return; }
    var p = (provSel.value === "finnhub") ? "finnhub" : "fmp";
    var ok = apiWriteStore(p, k);
    apiRefreshKeyState();
    apiSetStatus(ok
      ? "המפתח נשמר בדפדפן הזה (" + PROVIDER_NAME[p] + ")."
      : "לא הצלחתי לשמור בדפדפן — המפתח ישמש לטעינה הזאת בלבד.",
      ok ? "ok" : "warn");
  }

  function apiDoRemove(){
    apiDropKey();
    keyIn.value = "";
    apiEye(false);
    apiRefreshKeyState();
    apiResetToDemo();
    apiSetStatus(DATA.loaded
      ? "המפתח הוסר מהדפדפן. חזרת למחירי הסגירה המחושבים (" + (DATA.asOf || "—") + ")."
      : "המפתח הוסר מהדפדפן. חזרת לנתוני הדגם.", "ok");
  }

  function apiResetToDemo(){
    STOCKS.forEach(function(s){
      var d = demoSnap[s.ticker];
      if (d) { s.price = d.price; s.dayChange = d.dayChange; }
      s.live = false;
    });
    apiState.live = false;
    apiState.updatedAt = null;
    apiState.updated = [];
    renderAll();
    renderBanner();
  }

  function nowNY(){
    try { var ny = tzParts("America/New_York"); return ny.hour + ":" + ny.minute; }
    catch(e){ return "--:--"; }
  }
  function fileTimeNY(){
    if (!DATA.generatedAt) return nowNY();
    try {
      var d = new Date(DATA.generatedAt);
      if (isNaN(d.getTime())) return nowNY();
      return nyHM(d);
    } catch(e){ return nowNY(); }
  }
  /* HH:MM in New York for any Date — used by the banner stamp */
  function nyHM(d){
    try {
      return new Intl.DateTimeFormat("en-GB", {
        timeZone:"America/New_York", hour12:false, hour:"2-digit", minute:"2-digit"
      }).format(d);
    } catch(e){ return nowNY(); }
  }
  /* after a manual refresh the banner shows when we last pulled, not when the file was built */
  function bannerTimeNY(){
    return DATA.refreshedAt ? nyHM(DATA.refreshedAt) : fileTimeNY();
  }

  /* One banner, three truths: calculated close, live overlay, or demo fallback. */
  function renderBanner(){
    var el = document.getElementById("mockbar");
    if (!el) return;
    if (!DATA.loaded) {
      el.className = "mockbar demo";
      el.innerHTML = '<b class="tag">נתוני דגם</b><span>לא נטענו נתוני שוק — מוצגים נתוני דגם. ' +
        'קובץ <bdi class="num">indicators.json</bdi> לא נגיש (למשל בפתיחה מ-file://). ' +
        'המספרים כאן הם דוגמה קבועה, לא מחירי אמת.' +
        '<small class="bsub">אפשר לטעון מחירים חיים ידנית מכפתור ״נתוני שוק״ — המפתח נשמר בדפדפן בלבד.</small></span>';
      return;
    }
    el.className = "mockbar calc";
    var live = apiState.live;
    var fund = DATA.fundCount > 0;
    el.innerHTML = '<b class="tag">נתונים מחושבים</b><span> · סגירת ' + N(DATA.asOf || "—") +
      ' · נאסד״ק' + (fund ? ' + Finnhub' : '') + ' · עודכן ' + N(bannerTimeNY()) +
      (live ? ' · ' + N(apiState.updated.length + "/" + STOCKS.length) + ' מחירים חיים מ-' + esc(PROVIDER_NAME[apiState.provider]) : '') +
      '<small class="bsub">' + (fund
        ? 'פונדמנטלס חיים מ-Finnhub · החריג היחיד: בעלות מוסדית (עזר סטטי)'
        : 'פונדמנטלס (P/E, ROE, EPS, בעלות מוסדית, בטא, שווי שוק) הם ערכי עזר סטטיים') +
        (live ? ' · המחיר והשינוי היומי הם ציטוט חי; כל השאר מחושב מהסגירה' : '') + '.</small></span>';
  }

  function apiDoLoad(onDone){
    if (apiBusy) return;
    var k = (keyIn.value || "").trim() || apiState.key;
    if (!k) {
      apiSetStatus("הזן מפתח API, או שמור אותו קודם, ואז טען מחירים.", "err");
      keyIn.focus();
      return;
    }
    var p = (provSel.value === "finnhub") ? "finnhub" : "fmp";
    if (k !== apiState.key || p !== apiState.provider) apiWriteStore(p, k);
    apiRefreshKeyState();

    apiBusy = true;
    apiSyncButtons();

    var i = 0, got = [], missed = [], fatal = null, netSeen = 0, netRun = 0;

    function finish(){
      apiBusy = false;
      apiSyncButtons();
      var ok = false;
      if (fatal) {                                  /* nothing applied — rows stay exactly as they were */
        apiSetStatus(API_MSG[fatal], "err");
      } else if (!got.length) {
        apiSetStatus(netSeen ? API_MSG.net : "לא התקבלו מחירים מהספק. נסה שוב או בחר ספק אחר.", "err");
      } else {
        got.forEach(function(x){
          if (!demoSnap[x.s.ticker]) demoSnap[x.s.ticker] = { price:x.s.price, dayChange:x.s.dayChange };
          x.s.price = x.q.price;
          x.s.dayChange = x.q.change;
          x.s.live = true;
        });
        apiState.live = true;
        apiState.updatedAt = new Date();
        apiState.provider = p;
        apiState.updated = got.map(function(x){ return x.s.ticker; });
        renderAll();                                 /* sizing, radar averages, effective risk all recompute */
        renderBanner();
        apiSetStatus(got.length === STOCKS.length
          ? "התקבלו " + got.length + " מחירים חיים מ-" + PROVIDER_NAME[p] + ". האינדיקטורים נשארו מחושבים מהסגירה."
          : "התקבלו " + got.length + " מתוך " + STOCKS.length + " מחירים חיים; השאר נשארו במחירי הסגירה המחושבים.",
          got.length === STOCKS.length ? "ok" : "warn");
        ok = true;
      }
      if (typeof onDone === "function") onDone(ok);
    }

    function step(){
      var s = STOCKS[i];
      apiSetStatus("טוען " + (i + 1) + "/" + STOCKS.length, "");
      apiFetchQuote(p, s.ticker, k).then(function(q){
        if (q) { got.push({ s:s, q:q }); netRun = 0; }
        else missed.push(s.ticker);
      }).catch(function(err){
        var kind = (err && err.kind) || "net";
        if (kind === "auth" || kind === "rate") { fatal = kind; return; }
        missed.push(s.ticker);
        if (kind === "net") {
          netSeen++;
          netRun++;                          /* three dead requests in a row = provider unreachable */
          if (netRun >= 3) fatal = "net";
        }
      }).then(function(){
        i++;
        if (fatal) { finish(); return; }
        if (i >= STOCKS.length) { finish(); return; }
        setTimeout(step, 150);
      });
    }
    step();
  }

  /* ============================================================
     REFRESH — the header control.
     indicators.json is written by a cron job, so a plain reload can
     serve a stale copy; the pull is stamped with Date.now() and
     cache:"no-store". The merge is the same applyIndicators() the
     first paint uses, then the saved live-quote pass runs again and
     every derived number is recomputed from one place. A failed pull
     leaves the previous values exactly as they were.
     ============================================================ */
  var refreshing = false, refreshTimer = null;

  function refreshNote(msg, tone){
    var el = document.getElementById("refreshNote");
    if (!el) return;
    el.textContent = msg || "";
    el.className = "refresh-note" + (tone ? " " + tone : "");
  }
  function refreshBusy(on){
    refreshing = !!on;
    var b = document.getElementById("refreshBtn");
    if (!b) return;
    b.disabled = !!on;
    b.setAttribute("data-busy", on ? "1" : "0");
    b.setAttribute("aria-busy", on ? "true" : "false");
    var lab = b.querySelector(".rlabel");
    if (lab) lab.textContent = on ? "מרענן…" : "רענון";
  }
  function refreshHold(msg, tone){
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(function(){ if (!refreshing) refreshNote(""); }, 3000);
    refreshNote(msg, tone);
  }
  function refreshIndicators(){
    if (typeof fetch !== "function") return Promise.resolve(false);
    var url;
    try { url = new URL("indicators.json?t=" + Date.now(), document.baseURI).href; }
    catch(e){ url = "indicators.json?t=" + Date.now(); }
    return fetch(url, { cache:"no-store", credentials:"omit" })
      .then(function(res){ return res.ok ? res.text() : null; })
      .then(function(txt){
        if (!txt) return false;
        var js = null;
        try { js = JSON.parse(txt); } catch(e){ return false; }
        return applyIndicators(js);
      })
      .catch(function(){ return false; });
  }

  function refreshAll(){
    if (refreshing) return Promise.resolve(false);
    refreshBusy(true);
    refreshNote("מרענן נתונים…");
    return refreshIndicators().then(function(ok){
      if (!ok) {
        refreshBusy(false);
        refreshHold("הרענון נכשל — נשארו הנתונים הקודמים", "err");
        showToast("הרענון נכשל — נשארו הנתונים הקודמים");
        return false;                        /* nothing was applied — old numbers stand */
      }
      DATA.refreshedAt = new Date();
      renderAll();                           /* recommendations, radar, risk, sizing cells */
      renderExample();
      renderBanner();                        /* timestamp now shows the refresh HH:MM */

      if (!apiState.key || apiBusy) {
        refreshBusy(false);
        refreshHold("עודכן", "ok");
        return true;
      }
      return new Promise(function(resolve){
        apiDoLoad(function(gotQuotes){
          refreshBusy(false);
          if (gotQuotes) refreshHold("עודכן", "ok");
          else refreshHold(statusEl && statusEl.textContent ? statusEl.textContent : "הרענון נכשל — נשארו הנתונים הקודמים", "err");
          resolve(true);
        });
      });
    });
  }

  /* ============================================================
     WIRING
     ============================================================ */
  function renderAll(){
    resetCaches();                 /* layer toggles may have changed under us */
    renderProfile();
    renderGlossary();              /* help text quotes the active thresholds */
    renderRecs();
    renderTiming(false);
    renderRisk();
    renderRadar();
    renderLayers();
    renderTable();
    renderTraps();
  }

  function wire(){
    popEl = document.getElementById("pop");
    buildProfileSeg();              /* three presets, built from PROFILES once */

    /* --- refresh: re-pull the file, re-run quotes, recompute everything --- */
    var refreshBtn = document.getElementById("refreshBtn");
    if (refreshBtn) refreshBtn.addEventListener("click", function(){ refreshAll(); });

    /* --- search: filters the whole universe, not the rendered page --- */
    var searchIn = document.getElementById("searchInput");
    var searchClear = document.getElementById("searchClear");
    var searchTimer = null;
    function applySearch(v){
      state.q = String(v || "");
      state.limit = PAGE_SIZE;
      if (searchClear) searchClear.hidden = !state.q;
      renderTable();
    }
    if (searchIn) {
      searchIn.addEventListener("input", function(){
        if (searchTimer) clearTimeout(searchTimer);
        var v = searchIn.value;
        searchTimer = setTimeout(function(){ applySearch(v); }, 60);
      });
      searchIn.addEventListener("keydown", function(ev){
        if (ev.key === "Escape") {
          ev.preventDefault();
          if (searchTimer) clearTimeout(searchTimer);
          searchIn.value = "";
          applySearch("");
          searchIn.blur();
        } else if (ev.key === "Enter") {
          ev.preventDefault();
          if (searchTimer) clearTimeout(searchTimer);
          applySearch(searchIn.value);
        }
      });
    }
    if (searchClear) searchClear.addEventListener("click", function(){
      if (searchTimer) clearTimeout(searchTimer);
      searchIn.value = "";
      applySearch("");
      searchIn.focus();
    });

    /* --- live data sheet --- */
    sheetEl  = document.getElementById("apiSheet");
    bdEl     = document.getElementById("apiBackdrop");
    keyIn    = document.getElementById("apiKey");
    provSel  = document.getElementById("apiProvider");
    statusEl = document.getElementById("apiStatus");
    apiReadStore();
    apiRefreshKeyState();
    document.getElementById("apiOpen").addEventListener("click", apiOpenSheet);
    document.getElementById("apiClose").addEventListener("click", apiCloseSheet);
    bdEl.addEventListener("click", apiCloseSheet);
    document.getElementById("apiSave").addEventListener("click", apiDoSave);
    document.getElementById("apiLoad").addEventListener("click", apiDoLoad);
    document.getElementById("apiRemove").addEventListener("click", apiDoRemove);
    document.getElementById("apiEye").addEventListener("click", function(){ apiEye(keyIn.type === "password"); });
    keyIn.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); apiDoLoad(); } });
    provSel.addEventListener("change", function(){ provSel.blur(); });

    var pIn = document.getElementById("portfolioInput");
    pIn.addEventListener("input", function(){
      var v = num(pIn.value, null);
      if (v !== null) {
        state.portfolio = clamp(v, 1000, 10000000);
        save();
        renderRisk(); renderRadar(); renderTable(); renderTraps(); renderRecs();
      }
    });
    pIn.addEventListener("change", function(){
      state.portfolio = clamp(num(pIn.value, 25000), 1000, 10000000);
      pIn.value = String(state.portfolio);
      save();
      renderAll();
    });
    pIn.addEventListener("blur", function(){ pIn.value = String(state.portfolio); });

    var rIn = document.getElementById("riskSlider");
    rIn.addEventListener("input", function(){
      state.riskPct = clamp(num(rIn.value, 1), 0.25, 2.5);
      save();
      renderRisk(); renderRadar(); renderTable(); renderTraps(); renderRecs();
    });

    var cIn = document.getElementById("capInput");
    cIn.addEventListener("input", function(){
      var v = num(cIn.value, null);
      if (v !== null) {
        state.maxCapPct = clamp(v, 1, 100);
        save();
        renderRisk(); renderRadar(); renderTable(); renderTraps(); renderRecs();
      }
    });
    cIn.addEventListener("change", function(){
      state.maxCapPct = clamp(num(cIn.value, 15), 1, 100);
      cIn.value = String(state.maxCapPct);
      save();
      renderAll();
    });

    document.querySelectorAll('input[name="stopMode"]').forEach(function(r){
      r.addEventListener("change", function(){
        if (r.checked) {
          state.stopMode = r.value;
          save();
          renderAll();
        }
      });
    });

    document.getElementById("windowSelect").addEventListener("change", function(e){
      state.preview = e.target.value;
      renderTiming(false);
    });

    var sel = document.getElementById("rejectToggle");
    sel.checked = state.showRejects;
    var wrap = document.getElementById("rejectToggleWrap");
    wrap.classList.toggle("on", state.showRejects);
    sel.addEventListener("change", function(){
      state.showRejects = sel.checked;
      wrap.classList.toggle("on", state.showRejects);
      save();
      renderTraps();
    });

    document.getElementById("mobileSort").addEventListener("change", function(e){
      var parts = e.target.value.split(":");
      state.sortKey = parts[0];
      state.sortDir = parts[1] === "asc" ? 1 : -1;
      renderTable();
    });

    document.querySelectorAll("#stockTable thead th").forEach(function(th){
      th.addEventListener("click", function(){
        var k = th.getAttribute("data-sort");
        if (state.sortKey === k) state.sortDir = -state.sortDir;
        else { state.sortKey = k; state.sortDir = (k === "ticker" || k === "sector" || k === "rsi") ? 1 : -1; }
        renderTable();
      });
    });

    document.getElementById("backdrop").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", function(e){
      if (e.key !== "Escape") return;
      if (sheetEl && !sheetEl.hidden) { apiCloseSheet(); return; }
      if (popEl && !popEl.hidden) { closeTerm(true); return; }
      if (state.drawer) closeDrawer();
    });

    // one accessible pattern for every explainer
    document.addEventListener("click", function(e){
      var btn = e.target.closest ? e.target.closest(".q") : null;
      if (btn) {
        e.preventDefault();
        e.stopPropagation();
        if (popBtn === btn && popEl && !popEl.hidden) { closeTerm(true); return; }
        openTerm(btn.getAttribute("data-term"), btn);
        return;
      }
      if (popEl && !popEl.hidden && !(e.target.closest && e.target.closest("#pop"))) closeTerm(false);
    }, true);
    document.getElementById("popClose").addEventListener("click", function(){ closeTerm(true); });

    var stick = document.getElementById("stickbar");
    window.addEventListener("scroll", function(){
      var on = window.scrollY > 420 && window.innerWidth > 1000 && !state.drawer;
      stick.classList.toggle("show", on);
    }, { passive:true });
    window.addEventListener("resize", function(){
      closeTerm(false);
      stick.classList.toggle("show", window.scrollY > 420 && window.innerWidth > 1000 && !state.drawer);
      renderTable();
    }, { passive:true });
  }

  /* ============================================================
     EXAMPLE CARD — kept in sync with the live dataset, never a
     hard-coded PANW trade that the real numbers contradict.
     ============================================================ */
  function renderExample(){
    var list = document.getElementById("exampleList");
    var cap = document.getElementById("exampleCaption");
    if (!list) return;
    var s = passing()[0];
    if (!s) {
      s = STOCKS.filter(function(x){ return !sizing(x).invalid; })[0] || STOCKS[0];
    }
    var z = sizing(s);
    if (z.invalid) {
      list.innerHTML = '<div class="keyline"><span>החלטה</span><b class="overstop">סטופ מעל המחיר — לא לכניסה</b></div>' +
        '<div class="keyline"><span>מחיר</span><b>' + N(fmtMoney(s.price)) + '</b></div>' +
        '<div class="keyline"><span>סטופ</span><b>' + N(fmtMoney(z.stop)) + '</b></div>' +
        '<div class="keyline"><span>מניות</span><b>0</b></div>';
    } else {
      list.innerHTML = '<div class="keyline"><span>כמה לקנות</span><b>' + N(fmtInt(z.shares)) + ' מניות</b></div>' +
        '<div class="keyline"><span>כמה זה עולה</span><b>' + N(fmtMoney(z.cost, 0)) + '</b></div>' +
        '<div class="keyline"><span>איפה הסטופ</span><b>' + N(fmtMoney(z.stop)) + '</b></div>' +
        '<div class="keyline"><span>הפסד מקסימלי</span><b>' + N(fmtMoney(z.cashRisk, 0)) + '</b></div>' +
        '<div class="keyline"><span>יעד 2R</span><b>' + N(fmtMoney(z.target)) + '</b></div>';
    }
    if (cap) {
      cap.textContent = "דוגמה: " + s.ticker + " בתיק של " + fmtMoney(state.portfolio, 0) +
        " ובסיכון של " + state.riskPct.toFixed(2) + "%" +
        (DATA.loaded ? " · סגירת " + DATA.asOf : "");
    }
  }

  /* ============================================================
     BOOT
     ============================================================ */
  function bootData(){
    loadIndicators().then(function(ok){
      /* the calculated close is the baseline that "הסר מפתח" restores */
      STOCKS.forEach(function(s){ demoSnap[s.ticker] = { price:s.price, dayChange:s.dayChange }; });
      DATA.settled = true;
      document.documentElement.setAttribute("data-source", ok ? "calculated" : "demo");
      renderBanner();
      renderAll();
      renderExample();
    });
  }

  load();
  wire();
  renderGlossary();
  tickClocks();
  setInterval(tickClocks, 1000);
  bootData();

  // expose a tiny read-only snapshot for automated checks
  window.SafeTrend = {
    version: "2.3",
    stocks: STOCKS.map(function(s){ return s.ticker; }),
    universe: STOCKS.length,
    /* rendered page vs full set — the perf and paging checks read these */
    visible: function(){ return document.querySelectorAll("#stockBody tr[data-ticker]").length; },
    renderMs: function(){ return RENDER_MS; },
    query: function(q){
      var el = document.getElementById("searchInput");
      if (q === undefined) return state.q;
      state.q = String(q || "");
      state.limit = PAGE_SIZE;
      if (el) el.value = state.q;
      var cl = document.getElementById("searchClear");
      if (cl) cl.hidden = !state.q;
      renderTable();
      return state.q;
    },
    terms: Object.keys(TERMS),
    term: function(k){ var t = TERMS[k]; return t ? { t:t.t, s:termField(t, "s"), e:termField(t, "e") } : null; },
    data: function(){
      return { loaded:DATA.loaded, asOf:DATA.asOf, source:DATA.source,
               generatedAt:DATA.generatedAt, failed:DATA.failed.slice(0),
               applied:DATA.count, bars:barsLabel(),
               universe:DATA.universe, size:STOCKS.length, page:PAGE_SIZE, shown:state.limit,
               fundApplied:DATA.fundCount, fundSource:DATA.fundSource };
    },
    /* live fundamentals as rendered — live flags show what came from Finnhub */
    fundamentals: function(t){
      if (t) {
        var one = STOCKS.filter(function(x){ return x.ticker === t; })[0];
        if (!one) return null;
        return { ticker:one.ticker, pe:one.pe, roe:one.roe, epsGrowth:one.epsGrowth,
                 salesGrowth:one.salesGrowth, beta:one.beta, mcap:one.mcap, instOwn:one.instOwn,
                 live:Object.keys(one.fundLive || {}), instOwnLive:false };
      }
      return STOCKS.map(function(s){
        return { ticker:s.ticker, pe:s.pe, roe:s.roe, epsGrowth:s.epsGrowth,
                 salesGrowth:s.salesGrowth, beta:s.beta, mcap:s.mcap, instOwn:s.instOwn,
                 live:Object.keys(s.fundLive || {}) };
      });
    },
    passing: function(){ return passing().map(function(s){ return s.ticker; }); },
    /* the verdict a searched row carries: full 4-layer result, not the toggles */
    status: function(t){
      var one = STOCKS.filter(function(x){ return x.ticker === t; })[0];
      if (!one) return null;
      var st = statusOf(one);
      return { ticker:t, pass:st.pass, fails:st.fails.slice(0), checks:st.nd, why:st.why };
    },
    layers: function(){ return JSON.parse(JSON.stringify(state.layers)); },
    /* scan profile: read (no arg) or switch by name, then read back */
    profiles: function(){ return profileNames(); },
    profile: function(name){
      if (name === undefined){
        return { name: state.profile, def: PROFILES[state.profile] || null, isDefault:(state.profile === PROFILE_DEFAULT),
                 cfg: JSON.parse(JSON.stringify(scanCfg())), diffs: cfgDiffs(),
                 diffCount: cfgDiffCount(), ms: PROFILE_MS };
      }
      setProfile(String(name));
      return state.profile;
    },
    profileMs: function(){ return PROFILE_MS; },
    /* the zero-results fallback, as rendered: rank, tickers, and every failing check */
    closest: function(){
      var pool = searchRows();
      if (pool.some(function(s){ return evaluator(s).pass; })) return [];
      return closestRows(5, pool).map(function(r){
        return {
          ticker: r.s.ticker,
          failedLayers: r.layers.map(function(n){ return "L" + n; }),
          checks: r.active.map(function(d){
            return { layer:d.layer, text: d.text.replace(/<[^>]+>/g, "") };
          })
        };
      });
    },
    all: function(){
      return STOCKS.map(function(s){
        var z = sizing(s);
        return { ticker:s.ticker, price:+s.price.toFixed(2), dayChange:+s.dayChange.toFixed(2),
                 sma20:+s.sma20.toFixed(2), sma50:+s.sma50.toFixed(2), sma200:+s.sma200.toFixed(2),
                 rsi:+s.rsi.toFixed(1), rvol:+s.rvol.toFixed(2), closeStrength:+s.closeStrength.toFixed(1),
                 live:!!s.live, invalid:!!z.invalid, stop:+z.stop.toFixed(2),
                 shares:z.shares, fails:layerFails(s) };
      });
    },
    rows: function(){ return sortedRows().map(function(s){ var z = sizing(s); return { ticker:s.ticker, shares:z.shares, cost:+z.cost.toFixed(2), risk:+z.cashRisk.toFixed(2), stop:+z.stop.toFixed(2), target:+z.target.toFixed(2), invalid:!!z.invalid }; }); },
    config: function(){ return { portfolio:state.portfolio, riskPct:state.riskPct, maxCapPct:state.maxCapPct, stopMode:state.stopMode }; },
    /* the 'המלצות היום' card, as rendered */
    recs: function(){
      if (!DATA.loaded) return { ready:false, count:0, rows:[], blocked:[], total:STOCKS.length };
      var R = recPicks();
      return {
        ready:true, count:R.picks.length, found:R.found, total:R.total,
        blocked:R.blocked.map(function(r){ return r.s.ticker; }),
        rows:R.picks.map(function(r){
          return { ticker:r.s.ticker, shares:r.z.shares, stop:+r.z.stop.toFixed(2), target:+r.z.target.toFixed(2),
                   cost:+r.z.cost.toFixed(2), risk:+r.z.cashRisk.toFixed(2), capped:!!r.z.capped,
                   riskPct:+((r.z.cashRisk / state.portfolio) * 100).toFixed(2),
                   capPct:+((r.z.cost / state.portfolio) * 100).toFixed(1) };
        })
      };
    },
    refresh: function(){ return refreshAll(); },
    refreshing: function(){ return refreshing; },
    setLayers: function(obj){ Object.keys(obj).forEach(function(k){ state.layers[k] = !!obj[k]; }); renderAll(); renderExample(); },
    /* live-data snapshot — never exposes the key itself */
    price: function(t){ var s = STOCKS.filter(function(x){ return x.ticker === t; })[0]; return s ? +s.price.toFixed(2) : null; },
    sizing: function(t){ var s = STOCKS.filter(function(x){ return x.ticker === t; })[0]; if (!s) return null; var z = sizing(s); return { shares:z.shares, cost:+z.cost.toFixed(2), stop:+z.stop.toFixed(2), capped:z.capped, invalid:!!z.invalid }; },
    api: function(){ return { provider:apiState.provider, hasKey:!!apiState.key, live:!!apiState.live, updated:apiState.updated.slice(0), at:apiState.updatedAt ? apiState.updatedAt.getTime() : null }; }
  };
})();
</script>
</body>
</html>
